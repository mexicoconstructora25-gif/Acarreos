<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>App de Estimaciones</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0efe9;color:#1a1a1a;font-size:14px}
input,select,textarea,button{font-family:inherit;font-size:13px}
button{cursor:pointer}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:#fff;border-right:0.5px solid #e0deda;display:flex;flex-direction:column;padding:16px 0}
.sidebar-logo{padding:0 16px 16px;border-bottom:0.5px solid #e0deda;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.sidebar-logo h2{font-size:14px;font-weight:600;line-height:1.3}
.sidebar-logo p{font-size:11px;color:#999;margin-top:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;color:#5a5a5a;font-size:13px;transition:background .15s;border-left:3px solid transparent}
.nav-item:hover{background:#f0efe9}
.nav-item.active{background:#eff6ff;color:#2563eb;font-weight:500;border-left-color:#2563eb}
.nav-item i{font-size:18px;flex-shrink:0}
.main{flex:1;overflow:auto;display:flex;flex-direction:column}
.sync-bar{background:#eff6ff;border-bottom:0.5px solid #bfdbfe;padding:6px 24px;font-size:12px;color:#2563eb;display:flex;align-items:center;gap:6px;flex-shrink:0}
.content{padding:24px;flex:1;overflow:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:0.5px solid #cccac4;background:#fff;color:#1a1a1a;font-size:13px;cursor:pointer;transition:all .15s}
.btn:hover{background:#f0efe9}
.btn-primary{background:#2563eb;color:#fff;border-color:#2563eb}
.btn-primary:hover{background:#1d4ed8;border-color:#1d4ed8}
.btn-danger{background:#fef2f2;color:#dc2626;border-color:#fca5a5}
.btn-danger:hover{background:#fee2e2}
.btn-success{background:#f0fdf4;color:#16a34a;border-color:#86efac}
.btn-sm{padding:4px 10px;font-size:12px}
.card{background:#fff;border:0.5px solid #e0deda;border-radius:12px;padding:20px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.metric{background:#f8f7f4;border-radius:8px;padding:14px;text-align:center}
.metric-label{font-size:11px;color:#999;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.metric-value{font-size:20px;font-weight:600}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.4px;padding:8px 12px;border-bottom:0.5px solid #e0deda;text-align:left;background:#f8f7f4;white-space:nowrap}
td{padding:9px 12px;border-bottom:0.5px solid #e0deda;font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8f7f4}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-green{background:#f0fdf4;color:#16a34a}
.badge-blue{background:#eff6ff;color:#2563eb}
.badge-amber{background:#fffbeb;color:#b45309}
.badge-red{background:#fef2f2;color:#dc2626}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:500;color:#5a5a5a;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:7px 10px;border:0.5px solid #cccac4;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;transition:border .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#2563eb}
.form-group input:read-only{background:#f8f7f4;color:#999}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:#fff;border-radius:12px;width:600px;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-lg{width:720px}
.modal-header{padding:18px 20px;border-bottom:0.5px solid #e0deda;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-header h3{font-size:15px;font-weight:600}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:0.5px solid #e0deda;display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff}
.tabs{display:flex;border-bottom:0.5px solid #e0deda;margin-bottom:16px}
.tab{padding:9px 16px;font-size:13px;cursor:pointer;color:#5a5a5a;border-bottom:2px solid transparent;margin-bottom:-0.5px;white-space:nowrap}
.tab.active{color:#2563eb;border-bottom-color:#2563eb;font-weight:500}
.search-bar{display:flex;align-items:center;gap:8px;background:#f8f7f4;border:0.5px solid #e0deda;border-radius:8px;padding:7px 12px;margin-bottom:16px}
.search-bar input{border:none;background:transparent;flex:1;outline:none;font-size:13px}
.chip{display:inline-flex;padding:2px 8px;border-radius:20px;background:#f0efe9;border:0.5px solid #e0deda;font-size:11px;color:#5a5a5a}
.empty-state{text-align:center;padding:48px 24px;color:#999}
.empty-state i{font-size:36px;display:block;margin-bottom:12px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px}
.page-header h1{font-size:16px;font-weight:600}
.est-list-item{padding:12px 16px;border-bottom:0.5px solid #e0deda;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.est-list-item:hover{background:#f8f7f4}
.est-list-item.sel{background:#eff6ff;border-left-color:#2563eb}
.login-screen{display:flex;align-items:center;justify-content:center;height:100vh;background:#f0efe9}
.login-card{background:#fff;border-radius:16px;padding:40px;width:380px;border:0.5px solid #e0deda;box-shadow:0 8px 32px rgba(0,0,0,.08)}
.checkbox-row{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 0}
.checkbox-box{width:18px;height:18px;border-radius:4px;border:2px solid #ccc;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.checkbox-box.checked{border-color:#16a34a;background:#16a34a}
.producto-row{cursor:pointer;transition:background .15s}
.producto-row:hover td{background:#eff6ff !important}
.producto-row.expanded td{background:#eff6ff}
.precio-panel{background:#f8f7f4;border-radius:8px;padding:14px;margin:4px 0 8px}
.nav-section{padding:6px 16px 2px;font-size:10px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:.8px;margin-top:8px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

const SHEETS_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vTnB7hcrgLe977j_vQmi_bWqdsjOTZJhKpy2coyPYSF3nXpnaIA-8I6Hx_OIoTgVGZkXN3mOI-9H8sV/pub?output=csv";
const EMPRESA_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vTnB7hcrgLe977j_vQmi_bWqdsjOTZJhKpy2coyPYSF3nXpnaIA-8I6Hx_OIoTgVGZkXN3mOI-9H8sV/pub?gid=856107817&single=true&output=csv";

function parseCSV(text){
  const lines=text.trim().split('\n');
  const headers=lines[0].split(',').map(h=>h.trim().replace(/"/g,''));
  return lines.slice(1).map(line=>{
    const vals=[];let cur='';let inQ=false;
    for(let c of line){if(c==='"'){inQ=!inQ;}else if(c===','&&!inQ){vals.push(cur.trim());cur='';}else cur+=c;}
    vals.push(cur.trim());
    const obj={};headers.forEach((h,i)=>obj[h]=(vals[i]||'').replace(/"/g,'').trim());
    return obj;
  }).filter(r=>Object.values(r).some(v=>v));
}

const fmt=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n||0);
const fmtN=n=>new Intl.NumberFormat('es-MX').format(n||0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);

const DEMO_CAT=[
  {id:'1',Nombre:'Cemento gris 50kg',Categoria:'Materiales',Unidad:'Saco',Precio:'195.00',Proveedor:'CEMEX',CC:'MAT-001'},
  {id:'2',Nombre:'Varilla 3/8" x 12m',Categoria:'Acero',Unidad:'Pieza',Precio:'285.00',Proveedor:'DEACERO',CC:'ACR-002'},
  {id:'3',Nombre:'Block 15x20x40',Categoria:'Mampostería',Unidad:'Pza',Precio:'12.50',Proveedor:'BLOCKS SA',CC:'MMP-003'},
  {id:'4',Nombre:'Grava 3/4"',Categoria:'Pétreos',Unidad:'M3',Precio:'450.00',Proveedor:'PETREOS NW',CC:'PET-004'},
  {id:'5',Nombre:'Arena limpia',Categoria:'Pétreos',Unidad:'M3',Precio:'380.00',Proveedor:'PETREOS NW',CC:'PET-005'},
  {id:'6',Nombre:'Malla electrosoldada 6-6',Categoria:'Acero',Unidad:'Rollo',Precio:'1250.00',Proveedor:'DEACERO',CC:'ACR-006'},
  {id:'7',Nombre:'Tubo PVC 4" x 6m',Categoria:'Instalaciones',Unidad:'Pieza',Precio:'195.00',Proveedor:'AMANCO',CC:'INS-007'},
  {id:'8',Nombre:'Cable THW-LS 10AWG',Categoria:'Eléctrico',Unidad:'Metro',Precio:'28.50',Proveedor:'CONDUMEX',CC:'ELE-008'},
];

const DEMO_EMP={Nombre_em:'México Constructora',Sector:'Construcción',Obra:'',Logo:''};

// ── USERS ──
const USERS=[
  {user:'admin',pass:'admin123',role:'admin',label:'Administrador'},
  {user:'usuario',pass:'user123',role:'user',label:'Usuario'},
];

function loadLS(key,def){try{const v=localStorage.getItem(key);return v?JSON.parse(v):def;}catch{return def;}}
function saveLS(key,val){localStorage.setItem(key,JSON.stringify(val));}

// ════════════════════════════════════════
//  LOGIN
// ════════════════════════════════════════
function Login({onLogin}){
  const [u,setU]=useState('');const [p,setP]=useState('');const [err,setErr]=useState('');
  function tryLogin(){
    const found=USERS.find(x=>x.user===u&&x.pass===p);
    if(found)onLogin(found);else setErr('Usuario o contraseña incorrectos');
  }
  return(
    <div className="login-screen">
      <div className="login-card">
        <div style={{textAlign:'center',marginBottom:28}}>
          <i className="ti ti-building-skyscraper" style={{fontSize:40,color:'#2563eb',display:'block',marginBottom:8}}/>
          <h2 style={{fontSize:18,fontWeight:700}}>App de Estimaciones</h2>
          <p style={{fontSize:13,color:'#999',marginTop:4}}>Inicia sesión para continuar</p>
        </div>
        <div className="form-group"><label>Usuario</label><input value={u} onChange={e=>setU(e.target.value)} placeholder="admin / usuario" onKeyDown={e=>e.key==='Enter'&&tryLogin()}/></div>
        <div className="form-group"><label>Contraseña</label><input type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==='Enter'&&tryLogin()}/></div>
        {err&&<p style={{color:'#dc2626',fontSize:12,marginBottom:12}}>{err}</p>}
        <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',padding:'10px'}} onClick={tryLogin}>Entrar</button>
        <div style={{marginTop:16,background:'#f8f7f4',borderRadius:8,padding:'10px 14px',fontSize:12,color:'#5a5a5a'}}>
          <strong>Admin:</strong> admin / admin123<br/>
          <strong>Usuario:</strong> usuario / user123
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════
//  APP ROOT
// ════════════════════════════════════════
function App(){
  const [session,setSession]=useState(()=>loadLS('est_session',null));
  const [view,setView]=useState('dashboard');
  const [catalogo,setCatalogo]=useState(()=>loadLS('est_catalogo',[]));
  const [empresa,setEmpresa]=useState(()=>loadLS('est_empresa',DEMO_EMP));
  const [estimaciones,setEstimaciones]=useState(()=>loadLS('est_estimaciones',[]));
  const [histPrecios,setHistPrecios]=useState(()=>loadLS('est_histprecios',[]));
  const [syncMsg,setSyncMsg]=useState('');
  const [loading,setLoading]=useState(false);
  const [modal,setModal]=useState(null);

  const isAdmin=session?.role==='admin';

  useEffect(()=>{
    if(session&&catalogo.length===0)loadSheet();
    else if(session&&catalogo.length===0)setCatalogo(DEMO_CAT);
  },[session]);

  async function loadSheet(){
    setLoading(true);setSyncMsg('Conectando con Google Sheets...');
    try{
      const [r1,r2]=await Promise.allSettled([fetch(SHEETS_CSV),fetch(EMPRESA_CSV)]);
      if(r1.status==='fulfilled'&&r1.value.ok){
        const t=await r1.value.text();const d=parseCSV(t);
        if(d.length>0){setCatalogo(d);saveLS('est_catalogo',d);setSyncMsg(`✓ ${d.length} productos cargados`);}
        else{setCatalogo(DEMO_CAT);saveLS('est_catalogo',DEMO_CAT);setSyncMsg('Sheet vacío — demo activo');}
      } else {setCatalogo(DEMO_CAT);saveLS('est_catalogo',DEMO_CAT);setSyncMsg('Sin conexión — demo activo');}
      if(r2.status==='fulfilled'&&r2.value.ok){
        const t=await r2.value.text();const d=parseCSV(t);
        if(d.length>0){const emp={...DEMO_EMP,...d[0]};setEmpresa(emp);saveLS('est_empresa',emp);}
      }
    }catch{setCatalogo(DEMO_CAT);saveLS('est_catalogo',DEMO_CAT);setSyncMsg('Error de red — demo activo');}
    setLoading(false);setTimeout(()=>setSyncMsg(''),4000);
  }

  function login(u){setSession(u);saveLS('est_session',u);}
  function logout(){setSession(null);saveLS('est_session',null);setView('dashboard');}

  const openModal=(t,d=null)=>setModal({t,d});
  const closeModal=()=>setModal(null);

  function saveEst(e){
    const next=e.id?estimaciones.map(x=>x.id===e.id?e:x):[...estimaciones,{...e,id:uid(),fecha:new Date().toLocaleDateString('es-MX'),items:[],total:0}];
    setEstimaciones(next);saveLS('est_estimaciones',next);closeModal();
  }
  function delEst(id){const next=estimaciones.filter(e=>e.id!==id);setEstimaciones(next);saveLS('est_estimaciones',next);}
  function addItem(estId,item){
    const next=estimaciones.map(e=>{
      if(e.id!==estId)return e;
      const items=[...(e.items||[]),{...item,id:uid()}];
      return{...e,items,total:items.reduce((s,i)=>s+(+i.precio*+i.cantidad||0),0)};
    });
    setEstimaciones(next);saveLS('est_estimaciones',next);closeModal();
  }
  function removeItem(estId,itemId){
    const next=estimaciones.map(e=>{
      if(e.id!==estId)return e;
      const items=e.items.filter(i=>i.id!==itemId);
      return{...e,items,total:items.reduce((s,i)=>s+(+i.precio*+i.cantidad||0),0)};
    });
    setEstimaciones(next);saveLS('est_estimaciones',next);
  }
  function addPrecio(precio){
    let next=[...histPrecios];
    if(precio.vigente)next=next.map(x=>x.material===precio.material&&x.proveedor===precio.proveedor?{...x,vigente:false}:x);
    next=[...next,{...precio,id:uid(),fecha:new Date().toLocaleDateString('es-MX')}];
    setHistPrecios(next);saveLS('est_histprecios',next);
  }
  function toggleVigente(pid){
    const p=histPrecios.find(x=>x.id===pid);if(!p)return;
    const next=histPrecios.map(x=>x.material===p.material&&x.proveedor===p.proveedor?{...x,vigente:x.id===pid}:x);
    setHistPrecios(next);saveLS('est_histprecios',next);
  }
  function saveCatalogItem(item){
    let next;
    if(item.id&&catalogo.find(c=>c.id===item.id)){next=catalogo.map(c=>c.id===item.id?item:c);}
    else{next=[...catalogo,{...item,id:uid()}];}
    setCatalogo(next);saveLS('est_catalogo',next);closeModal();
  }
  function delCatalogItem(id){const next=catalogo.filter(c=>c.id!==id);setCatalogo(next);saveLS('est_catalogo',next);}
  function saveEmpresa(emp){setEmpresa(emp);saveLS('est_empresa',emp);}

  if(!session)return <Login onLogin={login}/>;

  const navItems=isAdmin?[
    {id:'dashboard',icon:'ti-dashboard',label:'Dashboard'},
    {id:'estimaciones',icon:'ti-clipboard-list',label:'Estimaciones'},
    {id:'catalogo',icon:'ti-package',label:'Catálogo'},
    {id:'precios',icon:'ti-tags',label:'Historial precios'},
    {id:'reportes',icon:'ti-chart-bar',label:'Reportes'},
    {id:'empresa',icon:'ti-building',label:'Empresa'},
    {id:'usuarios',icon:'ti-users',label:'Usuarios'},
  ]:[
    {id:'estimaciones',icon:'ti-clipboard-list',label:'Estimaciones'},
  ];

  // Si usuario normal intenta ver otra vista, forzar estimaciones
  const safeView=(!isAdmin&&view!=='estimaciones')?'estimaciones':view;

  return(
    <div className="app">
      <aside className="sidebar">
        <div className="sidebar-logo">
          {empresa.Logo
            ?<img src={empresa.Logo} style={{width:36,height:36,borderRadius:8,objectFit:'cover'}} onError={e=>e.target.style.display='none'}/>
            :<div style={{width:36,height:36,borderRadius:8,background:'#eff6ff',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><i className="ti ti-building-skyscraper" style={{color:'#2563eb',fontSize:18}}/></div>
          }
          <div>
            <h2>{empresa.Nombre_em||'Estimaciones'}</h2>
            <p>{session.label}</p>
          </div>
        </div>
        {navItems.map(n=>(
          <div key={n.id} className={`nav-item${safeView===n.id?' active':''}`} onClick={()=>setView(n.id)}>
            <i className={`ti ${n.icon}`}/>{n.label}
          </div>
        ))}
        <div style={{flex:1}}/>
        {isAdmin&&<div className="nav-item" onClick={loadSheet}><i className="ti ti-refresh"/>Sincronizar Sheet</div>}
        <div className="nav-item" onClick={logout}><i className="ti ti-logout"/>Cerrar sesión</div>
      </aside>
      <div className="main">
        {syncMsg&&<div className="sync-bar"><i className="ti ti-cloud"/>{syncMsg}</div>}
        {loading
          ?<div style={{display:'flex',alignItems:'center',justifyContent:'center',flex:1,color:'#999',gap:8}}><i className="ti ti-loader" style={{fontSize:20}}/>Cargando...</div>
          :<>
            {safeView==='dashboard'&&<Dashboard est={estimaciones} cat={catalogo} hp={histPrecios} empresa={empresa} fmt={fmt} fmtN={fmtN} setView={setView} openModal={openModal}/>}
            {safeView==='estimaciones'&&<Estimaciones est={estimaciones} cat={catalogo} hp={histPrecios} fmt={fmt} fmtN={fmtN} openModal={openModal} delEst={delEst} removeItem={removeItem} isAdmin={isAdmin} empresa={empresa}/>}
            {safeView==='catalogo'&&isAdmin&&<Catalogo cat={catalogo} hp={histPrecios} fmt={fmt} openModal={openModal} addPrecio={addPrecio} toggleVigente={toggleVigente} saveCatalogItem={saveCatalogItem} delCatalogItem={delCatalogItem}/>}
            {safeView==='precios'&&isAdmin&&<HistPrecios hp={histPrecios} cat={catalogo} est={estimaciones} fmt={fmt} fmtN={fmtN} toggleVigente={toggleVigente}/>}
            {safeView==='reportes'&&isAdmin&&<Reportes est={estimaciones} fmt={fmt} fmtN={fmtN}/>}
            {safeView==='empresa'&&isAdmin&&<EmpresaView empresa={empresa} onSave={saveEmpresa}/>}
            {safeView==='usuarios'&&isAdmin&&<Usuarios/>}
          </>
        }
      </div>
      {modal&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&closeModal()}>
          {modal.t==='nueva-est'&&<ModalNuevaEst empresa={empresa} onSave={saveEst} onClose={closeModal}/>}
          {modal.t==='add-item'&&<ModalAddItem estId={modal.d} cat={catalogo} hp={histPrecios} onSave={addItem} onClose={closeModal}/>}
          {modal.t==='edit-catalog'&&<ModalEditCatalog item={modal.d} onSave={saveCatalogItem} onClose={closeModal}/>}
        </div>
      )}
    </div>
  );
}

// ════════════════════════════════════════
//  DASHBOARD
// ════════════════════════════════════════
function Dashboard({est,cat,hp,empresa,fmt,fmtN,setView,openModal}){
  const total=est.reduce((s,e)=>s+(e.total||0),0);
  const provMap={};
  est.forEach(e=>(e.items||[]).forEach(i=>{
    const p=i.proveedor||'N/A';
    if(!provMap[p])provMap[p]={monto:0,qty:0};
    provMap[p].monto+=(+i.precio*+i.cantidad||0);provMap[p].qty+=(+i.cantidad||0);
  }));
  const topProv=Object.entries(provMap).sort((a,b)=>b[1].monto-a[1].monto).slice(0,5);
  return(
    <div className="content">
      <div className="page-header">
        <h1>Dashboard</h1>
        <button className="btn btn-primary" onClick={()=>openModal('nueva-est')}><i className="ti ti-plus"/>Nueva estimación</button>
      </div>
      <div className="grid-4" style={{marginBottom:20}}>
        {[
          {l:'Estimaciones',v:est.length,i:'ti-clipboard-list',c:'#2563eb'},
          {l:'Total estimado',v:fmt(total),i:'ti-currency-dollar',c:'#16a34a'},
          {l:'Productos',v:cat.length,i:'ti-package',c:'#b45309'},
          {l:'Precios hist.',v:hp.length,i:'ti-tags',c:'#7c3aed'},
        ].map((m,i)=>(
          <div key={i} className="metric">
            <i className={`ti ${m.i}`} style={{fontSize:24,color:m.c,display:'block',marginBottom:8}}/>
            <div className="metric-label">{m.l}</div>
            <div className="metric-value">{m.v}</div>
          </div>
        ))}

      <div className="grid-2">
        <div className="card">
          <p style={{fontWeight:600,fontSize:13,marginBottom:14,color:'#5a5a5a'}}>Últimas estimaciones</p>
          {est.length===0?<div className="empty-state"><i className="ti ti-clipboard-x"/><p>Sin estimaciones</p></div>:
          <table><thead><tr><th>Nombre</th><th>Fecha</th><th>Ítems</th><th>Total</th></tr></thead>
          <tbody>{est.slice(-5).reverse().map(e=>(
            <tr key={e.id}><td style={{fontWeight:500}}>{e.nombre}</td><td style={{color:'#999',fontSize:12}}>{e.fecha}</td><td><span className="badge badge-blue">{e.items?.length||0}</span></td><td style={{fontWeight:600,color:'#16a34a'}}>{fmt(e.total)}</td></tr>
          ))}</tbody></table>}
        </div>
        <div className="card">
          <p style={{fontWeight:600,fontSize:13,marginBottom:14,color:'#5a5a5a'}}>Top proveedores</p>
          {topProv.length===0?<div className="empty-state"><i className="ti ti-truck-off"/><p>Sin datos</p></div>:
          <table><thead><tr><th>Proveedor</th><th>Cant.</th><th>Monto</th></tr></thead>
          <tbody>{topProv.map(([p,v])=>(
            <tr key={p}><td style={{fontWeight:500}}>{p}</td><td>{fmtN(v.qty)}</td><td style={{fontWeight:600,color:'#16a34a'}}>{fmt(v.monto)}</td></tr>
          ))}</tbody></table>}
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════
//  ESTIMACIONES
// ════════════════════════════════════════
function Estimaciones({est,cat,hp,fmt,fmtN,openModal,delEst,removeItem,isAdmin,empresa}){

  const [tab,setTab]=useState('items');
  const s=est.find(e=>e.id===sel);

  const byProv={};const byMat={};
  (s?.items||[]).forEach(i=>{
    const p=i.proveedor||'N/A';const m=i.material||'N/A';
    if(!byProv[p])byProv[p]={qty:0,monto:0};
    byProv[p].qty+=(+i.cantidad||0);byProv[p].monto+=(+i.precio*+i.cantidad||0);
    if(!byMat[m])byMat[m]={qty:0,monto:0,unidad:i.unidad};
    byMat[m].qty+=(+i.cantidad||0);byMat[m].monto+=(+i.precio*+i.cantidad||0);

  return(
    <div className="content">

        <h1>Estimaciones</h1>
        <button className="btn btn-primary" onClick={()=>openModal('nueva-est')}><i className="ti ti-plus"/>Nueva estimación</button>
      </div>
      <div className="grid-2" style={{height:'calc(100vh - 130px)'}}>
        <div className="card" style={{padding:0,overflow:'auto'}}>
          <div style={{padding:'12px 16px',borderBottom:'0.5px solid #e0deda',fontWeight:600,fontSize:13,color:'#5a5a5a'}}>Listado ({est.length})</div>
          {est.length===0?<div className="empty-state"><i className="ti ti-clipboard-x"/><p>Sin estimaciones</p></div>:
          est.map(e=>(
            <div key={e.id} className={`est-list-item${sel===e.id?' sel':''}`} onClick={()=>{setSel(e.id);setTab('items');}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div><p style={{fontWeight:500}}>{e.nombre}</p><p style={{fontSize:11,color:'#999',marginTop:2}}>{e.obra||'Sin obra'} · {e.fecha}</p></div>
                <div style={{textAlign:'right'}}><p style={{fontWeight:700,color:'#16a34a'}}>{fmt(e.total)}</p><p style={{fontSize:11,color:'#999'}}>{e.items?.length||0} ítems</p></div>
              </div>
              {sel===e.id&&(
                <div style={{display:'flex',gap:6,marginTop:10}} onClick={ev=>ev.stopPropagation()}>
                  <button className="btn btn-sm btn-primary" onClick={()=>openModal('add-item',e.id)}><i className="ti ti-plus"/>Agregar ítem</button>
                  {isAdmin&&<button className="btn btn-sm btn-danger" onClick={()=>{if(confirm('¿Eliminar?')){delEst(e.id);setSel(null);}}}><i className="ti ti-trash"/></button>}
                </div>
              )}
            </div>
          ))}
        </div>
        <div className="card" style={{padding:0,overflow:'auto'}}>
          {!s?<div className="empty-state"><i className="ti ti-hand-click"/><p>Selecciona una estimación</p></div>:(
            <>
            <div style={{padding:'14px 16px',borderBottom:'0.5px solid #e0deda'}}>
              {/* Encabezado empresa */}
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10,paddingBottom:10,borderBottom:'0.5px solid #e0deda'}}>
                {empresa.Logo&&<img src={empresa.Logo} style={{width:36,height:36,objectFit:'cover',borderRadius:6}} onError={e=>e.target.style.display='none'}/>}
                <div>
                  <p style={{fontWeight:700,fontSize:13}}>{empresa.Nombre_em||'—'}</p>
                  <p style={{fontSize:11,color:'#999'}}>{empresa.Sector} {empresa.Obra?'· '+empresa.Obra:''}</p>
                </div>
                <div style={{marginLeft:'auto',textAlign:'right'}}>
                  <p style={{fontWeight:700,color:'#16a34a',fontSize:16}}>{fmt(s.total)}</p>
                  <p style={{fontSize:11,color:'#999'}}>Total estimado</p>
                </div>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                <div><p style={{fontWeight:600,fontSize:14}}>{s.nombre}</p><p style={{fontSize:11,color:'#999'}}>{s.obra} · {s.fecha}</p></div>
              </div>
              <div className="tabs" style={{marginBottom:0}}>

                  <div key={k} className={`tab${tab===k?' active':''}`} onClick={()=>setTab(k)}>{l}</div>

            </div>
            <div style={{padding:16}}>

                <tbody>{Object.entries(byMat).map(([m,v])=>(
                  <tr key={m}><td style={{fontWeight:500}}>{m}</td><td>{v.unidad}</td><td>{fmtN(v.qty)}</td><td style={{fontWeight:600,color:'#16a34a'}}>{fmt(v.monto)}</td></tr>

    </div>
  );
}

// ════════════════════════════════════════
//  CATÁLOGO con precios inline
// ════════════════════════════════════════
function Catalogo({cat,hp,fmt,openModal,addPrecio,toggleVigente,saveCatalogItem,delCatalogItem}){
  const [q,setQ]=useState('');
  const [expanded,setExpanded]=useState(null);
  const [newPrecio,setNewPrecio]=useState({precio:'',notas:'',vigente:true});

  const f=cat.filter(c=>!q||[c.Nombre,c.Proveedor,c.Categoria].some(x=>x?.toLowerCase().includes(q.toLowerCase())));

  function handleAddPrecio(item){
    if(!newPrecio.precio)return;
    addPrecio({material:item.Nombre,proveedor:item.Proveedor,precio:newPrecio.precio,notas:newPrecio.notas,vigente:newPrecio.vigente});
    setNewPrecio({precio:'',notas:'',vigente:true});
  }

  function getPreciosItem(item){return hp.filter(p=>p.material===item.Nombre&&p.proveedor===item.Proveedor);}

  return(
    <div className="content">
      <div className="page-header">
        <h1>Catálogo de productos</h1>
        <div style={{display:'flex',gap:8'}}>
          <span className="badge badge-blue">{cat.length} productos</span>
          <button className="btn btn-primary" style={{marginLeft:8}} onClick={()=>openModal('edit-catalog',null)}><i className="ti ti-plus"/>Nuevo producto</button>
        </div>
      </div>
      <div className="search-bar"><i className="ti ti-search" style={{color:'#999'}}/><input placeholder="Buscar..." value={q} onChange={e=>setQ(e.target.value)}/></div>
      <div className="card" style={{padding:0}}>
        <table>
          <thead><tr><th>Nombre</th><th>Categoría</th><th>Unidad</th><th>Precio base</th><th>Proveedor</th><th>C.C</th><th>Precio vigente</th><th></th></tr></thead>
          <tbody>
          {f.length===0?<tr><td colSpan={8} style={{textAlign:'center',padding:32,color:'#999'}}>Sin resultados</td></tr>:
          f.map(c=>{
            const precios=getPreciosItem(c);
            const vigente=precios.find(p=>p.vigente);
            const isExp=expanded===c.id;
            return(
              <React.Fragment key={c.id}>
                <tr className={`producto-row${isExp?' expanded':''}`} onClick={()=>setExpanded(isExp?null:c.id)}>
                  <td style={{fontWeight:500}}>{c.Nombre}</td>
                  <td><span className="chip">{c.Categoria}</span></td>
                  <td>{c.Unidad}</td>
                  <td style={{color:'#16a34a',fontWeight:600}}>{fmt(+c.Precio||0)}</td>
                  <td>{c.Proveedor}</td>
                  <td style={{fontSize:12,color:'#999'}}>{c.CC}</td>
                  <td>{vigente?<span className="badge badge-green"><i className="ti ti-check"/>{fmt(+vigente.precio)}</span>:<span style={{color:'#ccc',fontSize:12}}>—</span>}</td>
                  <td>
                    <div style={{display:'flex',gap:4}} onClick={e=>e.stopPropagation()}>
                      <button className="btn btn-sm" onClick={()=>openModal('edit-catalog',c)}><i className="ti ti-edit"/></button>
                      <button className="btn btn-sm btn-danger" onClick={()=>{if(confirm('¿Eliminar producto?'))delCatalogItem(c.id)}}><i className="ti ti-trash"/></button>
                    </div>
                  </td>
                </tr>
                {isExp&&(
                  <tr>
                    <td colSpan={8} style={{padding:0,background:'#f8fbff'}}>
                      <div style={{padding:'14px 20px'}}>
                        <p style={{fontWeight:600,fontSize:12,marginBottom:12,color:'#2563eb'}}>Historial de precios — {c.Nombre}</p>
                        {precios.length===0?<p style={{fontSize:12,color:'#999',marginBottom:12}}>Sin precios registrados aún.</p>:
                        <table style={{marginBottom:12}}>
                          <thead><tr><th>Precio</th><th>Fecha</th><th>Notas</th><th>Vigente</th></tr></thead>
                          <tbody>{precios.map(p=>(
                            <tr key={p.id}>
                              <td style={{fontWeight:600,color:'#16a34a'}}>{fmt(+p.precio)}</td>
                              <td style={{fontSize:12,color:'#999'}}>{p.fecha}</td>
                              <td style={{fontSize:12}}>{p.notas||'—'}</td>
                              <td>
                                <div className="checkbox-row" onClick={()=>toggleVigente(p.id)}>
                                  <div className={`checkbox-box${p.vigente?' checked':''}`}>
                                    {p.vigente&&<i className="ti ti-check" style={{color:'#fff',fontSize:11}}/>}
                                  </div>
                                  {p.vigente&&<span className="badge badge-green" style={{fontSize:10}}>Vigente</span>}
                                </div>
                              </td>
                            </tr>
                          ))}</tbody>
                        </table>}
                        {/* Agregar nuevo precio */}
                        <div style={{background:'#fff',borderRadius:8,padding:'12px 14px',border:'0.5px solid #bfdbfe'}}>
                          <p style={{fontSize:12,fontWeight:600,marginBottom:10,color:'#2563eb'}}>Registrar nuevo precio</p>
                          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr auto',gap:8,alignItems:'end'}}>
                            <div className="form-group" style={{marginBottom:0}}>
                              <label>Precio *</label>
                              <input type="number" step="any" value={newPrecio.precio} onChange={e=>setNewPrecio(x=>({...x,precio:e.target.value}))} placeholder="0.00"/>
                            </div>
                            <div className="form-group" style={{marginBottom:0}}>
                              <label>Notas</label>
                              <input value={newPrecio.notas} onChange={e=>setNewPrecio(x=>({...x,notas:e.target.value}))} placeholder="Opcional"/>
                            </div>
                            <button className="btn btn-primary btn-sm" style={{height:34}} onClick={()=>handleAddPrecio(c)} disabled={!newPrecio.precio}><i className="ti ti-plus"/>Agregar</button>
                          </div>
                          <div className="checkbox-row" style={{marginTop:8}} onClick={()=>setNewPrecio(x=>({...x,vigente:!x.vigente}))}>
                            <div className={`checkbox-box${newPrecio.vigente?' checked':''}`}>{newPrecio.vigente&&<i className="ti ti-check" style={{color:'#fff',fontSize:11}}/>}</div>
                            <span style={{fontSize:12}}>Marcar como precio vigente</span>
                          </div>
                        </div>
                      </div>
                    </td>
                  </tr>
                )}
              </React.Fragment>
            );
          })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ════════════════════════════════════════
//  HISTORIAL PRECIOS
// ════════════════════════════════════════
function HistPrecios({hp,cat,est,fmt,fmtN,toggleVigente}){
  const [q,setQ]=useState('');
  const f=hp.filter(p=>!q||[p.material,p.proveedor].some(x=>x?.toLowerCase().includes(q.toLowerCase())));
  const acum={};
  est.forEach(e=>(e.items||[]).forEach(i=>{
    const k=`${i.material}||${i.proveedor}||${i.precio}`;
    if(!acum[k])acum[k]={qty:0,monto:0};
    acum[k].qty+=(+i.cantidad||0);acum[k].monto+=(+i.precio*+i.cantidad||0);
  }));
  return(
    <div className="content">
      <div className="page-header"><h1>Historial de precios</h1></div>
      <div className="search-bar"><i className="ti ti-search" style={{color:'#999'}}/><input placeholder="Buscar..." value={q} onChange={e=>setQ(e.target.value)}/></div>
      <div className="card" style={{padding:0}}>
        <table>
          <thead><tr><th>Material</th><th>Proveedor</th><th>Precio</th><th>Fecha</th><th>Vigente</th><th>Cant. acum.</th><th>Monto acum.</th><th>Notas</th></tr></thead>
          <tbody>
          {f.length===0?<tr><td colSpan={8} style={{textAlign:'center',padding:32,color:'#999'}}>{hp.length===0?'Sin precios — agrégalos desde el Catálogo':'Sin resultados'}</td></tr>:
          f.map(p=>{
            const k=`${p.material}||${p.proveedor}||${p.precio}`;const a=acum[k]||{qty:0,monto:0};
            return(<tr key={p.id}>
              <td style={{fontWeight:500}}>{p.material}</td><td>{p.proveedor}</td>
              <td style={{fontWeight:600,color:'#16a34a'}}>{fmt(+p.precio)}</td>
              <td style={{fontSize:12,color:'#999'}}>{p.fecha}</td>
              <td>
                <div className="checkbox-row" onClick={()=>toggleVigente(p.id)}>
                  <div className={`checkbox-box${p.vigente?' checked':''}`}>{p.vigente&&<i className="ti ti-check" style={{color:'#fff',fontSize:11}}/>}</div>
                  {p.vigente&&<span className="badge badge-green" style={{marginLeft:4}}>Vigente</span>}
                </div>
              </td>
              <td>{a.qty>0?fmtN(a.qty):'—'}</td>
              <td style={{fontWeight:600,color:a.monto>0?'#2563eb':'#999'}}>{a.monto>0?fmt(a.monto):'—'}</td>
              <td style={{fontSize:12,color:'#999'}}>{p.notas||'—'}</td>
            </tr>);
          })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ════════════════════════════════════════
//  REPORTES
// ════════════════════════════════════════
function Reportes({est,fmt,fmtN}){
  const byProv={};const byCat={};
  est.forEach(e=>(e.items||[]).forEach(i=>{
    const p=i.proveedor||'N/A';const c=i.categoria||'N/A';
    if(!byProv[p])byProv[p]={qty:0,monto:0,ests:new Set()};
    byProv[p].qty+=(+i.cantidad||0);byProv[p].monto+=(+i.precio*+i.cantidad||0);byProv[p].ests.add(e.id);
    if(!byCat[c])byCat[c]={qty:0,monto:0};
    byCat[c].qty+=(+i.cantidad||0);byCat[c].monto+=(+i.precio*+i.cantidad||0);
  }));
  const tot=Object.values(byProv).reduce((s,v)=>s+v.monto,0);
  return(
    <div className="content">
      <div className="page-header"><h1>Reportes acumulados</h1></div>
      <div className="grid-2" style={{marginBottom:16}}>
        <div className="card">
          <p style={{fontWeight:600,fontSize:13,marginBottom:14,color:'#5a5a5a'}}>Por proveedor</p>
          {Object.keys(byProv).length===0?<div className="empty-state" style={{padding:24}}><i className="ti ti-chart-off"/><p>Sin datos</p></div>:
          <table><thead><tr><th>Proveedor</th><th>Est.</th><th>Cant.</th><th>Monto</th><th>%</th></tr></thead>
          <tbody>{Object.entries(byProv).sort((a,b)=>b[1].monto-a[1].monto).map(([p,v])=>(
            <tr key={p}><td style={{fontWeight:500}}>{p}</td><td><span className="badge badge-blue">{v.ests.size}</span></td><td>{fmtN(v.qty)}</td><td style={{fontWeight:600,color:'#16a34a'}}>{fmt(v.monto)}</td><td style={{fontSize:12,color:'#999'}}>{tot>0?((v.monto/tot)*100).toFixed(1)+'%':'—'}</td></tr>
          ))}</tbody></table>}
        </div>
        <div className="card">
          <p style={{fontWeight:600,fontSize:13,marginBottom:14,color:'#5a5a5a'}}>Por categoría</p>
          {Object.keys(byCat).length===0?<div className="empty-state" style={{padding:24}}><i className="ti ti-chart-off"/><p>Sin datos</p></div>:
          <table><thead><tr><th>Categoría</th><th>Cant.</th><th>Monto</th><th>%</th></tr></thead>
          <tbody>{Object.entries(byCat).sort((a,b)=>b[1].monto-a[1].monto).map(([c,v])=>(
            <tr key={c}><td><span className="chip">{c}</span></td><td>{fmtN(v.qty)}</td><td style={{fontWeight:600,color:'#16a34a'}}>{fmt(v.monto)}</td><td style={{fontSize:12,color:'#999'}}>{tot>0?((v.monto/tot)*100).toFixed(1)+'%':'—'}</td></tr>
          ))}</tbody></table>}
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════
//  EMPRESA VIEW
// ════════════════════════════════════════
function EmpresaView({empresa,onSave}){
  const [form,setForm]=useState({...empresa});
  const [logoPreview,setLogoPreview]=useState(empresa.Logo||'');
  const [saved,setSaved]=useState(false);
  const fileRef=useRef();
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  function handleLogoFile(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{const url=ev.target.result;setLogoPreview(url);set('Logo',url);};
    reader.readAsDataURL(file);
  }
  function handleSave(){onSave(form);setSaved(true);setTimeout(()=>setSaved(false),2000);}

  return(
    <div className="content">
      <div className="page-header"><h1>Datos de empresa</h1></div>
      <div className="grid-2">
        {/* Form */}
        <div className="card">
          <p style={{fontWeight:600,fontSize:13,marginBottom:16,color:'#5a5a5a'}}>Información general</p>
          <div className="form-group"><label>Nombre de la empresa</label><input value={form.Nombre_em||''} onChange={e=>set('Nombre_em',e.target.value)} placeholder="México Constructora SA de CV"/></div>
          <div className="form-group"><label>Sector</label><input value={form.Sector||''} onChange={e=>set('Sector',e.target.value)} placeholder="Construcción"/></div>
          <div className="form-group"><label>Obra / Proyecto actual</label><input value={form.Obra||''} onChange={e=>set('Obra',e.target.value)} placeholder="Ej: Residencial Las Palmas"/></div>
          <div className="form-group">
            <label>Logo</label>
            <div style={{display:'flex',gap:10,alignItems:'center'}}>
              <input value={form.Logo||''} onChange={e=>{set('Logo',e.target.value);setLogoPreview(e.target.value);}} placeholder="URL de imagen o sube un archivo"/>
              <button className="btn btn-sm" onClick={()=>fileRef.current.click()}><i className="ti ti-upload"/>Subir</button>
              <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleLogoFile}/>
            </div>
          </div>
          <button className="btn btn-primary" onClick={handleSave} style={{width:'100%',justifyContent:'center'}}>
            {saved?<><i className="ti ti-check"/>Guardado</>:<><i className="ti ti-device-floppy"/>Guardar cambios</>}
          </button>
        </div>
        {/* Preview encabezado */}
        <div className="card">
          <p style={{fontWeight:600,fontSize:13,marginBottom:16,color:'#5a5a5a'}}>Vista previa del encabezado</p>

              {logoPreview
                ?<img src={logoPreview} style={{width:52,height:52,borderRadius:8,objectFit:'cover',background:'#fff'}} onError={e=>e.target.style.display='none'}/>
                :<div style={{width:52,height:52,borderRadius:8,background:'rgba(255,255,255,.15)',display:'flex',alignItems:'center',justifyContent:'center'}}><i className="ti ti-building" style={{color:'#fff',fontSize:24}}/></div>
              }

                <p style={{color:'#fff',fontWeight:700,fontSize:16}}>{form.Nombre_em||'Nombre de empresa'}</p>
                <p style={{color:'rgba(255,255,255,.7)',fontSize:12,marginTop:2}}>{form.Sector||'Sector'}</p>

            <div style={{padding:'12px 20px',background:'#f8f7f4',borderTop:'2px solid #2563eb'}}>

                <div><span style={{color:'#999'}}>Obra: </span><strong>{form.Obra||'Sin obra asignada'}</strong></div>
                <div><span style={{color:'#999'}}>Fecha: </span><strong>{new Date().toLocaleDateString('es-MX')}</strong></div>
              </div>
            </div>
          </div>
          <p style={{fontSize:11,color:'#999',marginTop:10}}>Este encabezado aparece en la vista de cada estimación.</p>
        </div>
      </div>

  );
}

//  MODALES
// ════════════════════════════════════════
function ModalNuevaEst({empresa,onSave,onClose}){
  const [f,setF]=useState({nombre:'',obra:empresa.Obra||'',descripcion:''});
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  return(
    <div className="modal">
      <div className="modal-header"><h3>Nueva estimación</h3><button className="btn btn-sm" onClick={onClose}><i className="ti ti-x"/></button></div>
      <div className="modal-body">
        {/* mini encabezado empresa */}
        <div style={{background:'#f8f7f4',borderRadius:8,padding:'10px 14px',marginBottom:16,fontSize:12,display:'flex',alignItems:'center',gap:10}}>
          {empresa.Logo&&<img src={empresa.Logo} style={{width:28,height:28,borderRadius:4,objectFit:'cover'}} onError={e=>e.target.style.display='none'}/>}
          <div><strong>{empresa.Nombre_em||'—'}</strong><span style={{color:'#999',marginLeft:6}}>{empresa.Sector}</span></div>
        </div>
        <div className="form-group"><label>Nombre de la estimación *</label><input value={f.nombre} onChange={e=>s('nombre',e.target.value)} placeholder="Ej: Estimación cimentación fase 1"/></div>
        <div className="form-group"><label>Obra / Proyecto</label><input value={f.obra} onChange={e=>s('obra',e.target.value)} placeholder="Ej: Residencial Las Palmas"/></div>
        <div className="form-group"><label>Descripción</label><textarea rows={3} value={f.descripcion} onChange={e=>s('descripcion',e.target.value)} style={{resize:'vertical'}}/></div>
      </div>
      <div className="modal-footer">
        <button className="btn" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!f.nombre} onClick={()=>onSave(f)}>Crear</button>
      </div>
    </div>
  );
}

function ModalAddItem({estId,cat,hp,onSave,onClose}){
  const [selId,setSelId]=useState('');
  const [cant,setCant]=useState('');
  const [precioOv,setPrecioOv]=useState('');
  const item=cat.find(c=>c.id===selId);
  const vigente=item?hp.find(p=>p.material===item.Nombre&&p.proveedor===item.Proveedor&&p.vigente):null;
  const precioBase=precioOv||(vigente?.precio)||(item?.Precio)||'';
  return(
    <div className="modal">
      <div className="modal-header"><h3>Agregar ítem a estimación</h3><button className="btn btn-sm" onClick={onClose}><i className="ti ti-x"/></button></div>
      <div className="modal-body">
        <div className="form-group">
          <label>Producto *</label>
          <select value={selId} onChange={e=>setSelId(e.target.value)}>
            <option value="">— Selecciona —</option>
            {cat.map((c,i)=><option key={i} value={c.id}>{c.Nombre} · {c.Proveedor}</option>)}
          </select>
        </div>
        {item&&(
          <div style={{background:'#f8f7f4',borderRadius:8,padding:'10px 14px',marginBottom:14,fontSize:12,display:'flex',gap:16,flexWrap:'wrap'}}>
            <span><span style={{color:'#999'}}>Cat.:</span> {item.Categoria}</span>
            <span><span style={{color:'#999'}}>Und.:</span> {item.Unidad}</span>
            <span><span style={{color:'#999'}}>C.C:</span> {item.CC}</span>
            <span><span style={{color:'#999'}}>Precio base:</span> <strong style={{color:'#16a34a'}}>{fmt(+item.Precio||0)}</strong></span>
            {vigente&&<span className="badge badge-green"><i className="ti ti-check"/>Vigente: {fmt(+vigente.precio)}</span>}
          </div>
        )}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div className="form-group"><label>Cantidad *</label><input type="number" min="0" step="any" value={cant} onChange={e=>setCant(e.target.value)} placeholder="0"/></div>
          <div className="form-group"><label>Precio unitario</label><input type="number" step="any" value={precioOv} onChange={e=>setPrecioOv(e.target.value)} placeholder={precioBase||'0.00'}/></div>
        </div>
        {item&&cant&&<div style={{background:'#f0fdf4',borderRadius:8,padding:'10px 14px',border:'0.5px solid #86efac'}}>
          <strong style={{color:'#16a34a'}}>Subtotal: {fmt((+precioBase||0)*(+cant||0))}</strong>
        </div>}
      </div>
      <div className="modal-footer">
        <button className="btn" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!item||!cant} onClick={()=>onSave(estId,{material:item.Nombre,proveedor:item.Proveedor,unidad:item.Unidad,precio:precioBase,cantidad:cant,categoria:item.Categoria,cc:item.CC})}>Agregar</button>
      </div>
    </div>
  );
}

function ModalEditCatalog({item,onSave,onClose}){
  const [f,setF]=useState(item||{id:'',Nombre:'',Categoria:'',Unidad:'',Precio:'',Proveedor:'',CC:''});
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  const isNew=!item;
  return(
    <div className="modal">
      <div className="modal-header"><h3>{isNew?'Nuevo producto':'Editar producto'}</h3><button className="btn btn-sm" onClick={onClose}><i className="ti ti-x"/></button></div>
      <div className="modal-body">
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div className="form-group" style={{gridColumn:'1/-1'}}><label>Nombre *</label><input value={f.Nombre} onChange={e=>s('Nombre',e.target.value)} placeholder="Nombre del producto"/></div>
          <div className="form-group"><label>Categoría</label><input value={f.Categoria} onChange={e=>s('Categoria',e.target.value)} placeholder="Materiales, Acero..."/></div>
          <div className="form-group"><label>Unidad</label><input value={f.Unidad} onChange={e=>s('Unidad',e.target.value)} placeholder="Saco, M3, Pieza..."/></div>
          <div className="form-group"><label>Precio base</label><input type="number" step="any" value={f.Precio} onChange={e=>s('Precio',e.target.value)} placeholder="0.00"/></div>
          <div className="form-group"><label>Proveedor</label><input value={f.Proveedor} onChange={e=>s('Proveedor',e.target.value)} placeholder="Nombre del proveedor"/></div>
          <div className="form-group" style={{gridColumn:'1/-1'}}><label>C.C (Centro de costo)</label><input value={f.CC} onChange={e=>s('CC',e.target.value)} placeholder="MAT-001"/></div>
        </div>
      </div>
      <div className="modal-footer">
        <button className="btn" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!f.Nombre} onClick={()=>onSave(f)}>{isNew?'Crear producto':'Guardar cambios'}</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
