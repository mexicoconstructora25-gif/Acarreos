<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>App de Estimaciones</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0efe9;color:#1a1a1a;font-size:14px}
input,select,textarea,button{font-family:inherit;font-size:13px}
button{cursor:pointer}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:#fff;border-right:0.5px solid #e0deda;display:flex;flex-direction:column;padding:16px 0}
.sidebar-logo{padding:0 16px 16px;border-bottom:0.5px solid #e0deda;margin-bottom:8px}
.sidebar-logo h2{font-size:14px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;color:#5a5a5a;font-size:13px;transition:background .15s;border-left:3px solid transparent}
.nav-item:hover{background:#f0efe9}
.nav-item.active{background:#eff6ff;color:#2563eb;font-weight:500;border-left-color:#2563eb}
.nav-item i{font-size:18px}
.main{flex:1;overflow:auto;display:flex;flex-direction:column}
.sync-bar{background:#eff6ff;border-bottom:0.5px solid #bfdbfe;padding:6px 24px;font-size:12px;color:#2563eb;display:flex;align-items:center;gap:6px;flex-shrink:0}
.sync-bar.error{background:#fef2f2;border-bottom-color:#fca5a5;color:#dc2626}
.sync-bar.ok{background:#f0fdf4;border-bottom-color:#86efac;color:#16a34a}
.content{padding:24px;flex:1;overflow:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:0.5px solid #cccac4;background:#fff;color:#1a1a1a;font-size:13px;cursor:pointer;transition:all .15s}
.btn:hover{background:#f0efe9}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:#2563eb;color:#fff;border-color:#2563eb}
.btn-primary:hover:not(:disabled){background:#1d4ed8}
.btn-danger{background:#fef2f2;color:#dc2626;border-color:#fca5a5}
.btn-danger:hover{background:#fee2e2}
.btn-success{background:#f0fdf4;color:#16a34a;border-color:#86efac}
.btn-warning{background:#fffbeb;color:#b45309;border-color:#fcd34d}
.btn-sm{padding:4px 10px;font-size:12px}
.card{background:#fff;border:0.5px solid #e0deda;border-radius:12px;padding:20px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.metric{background:#f8f7f4;border-radius:8px;padding:14px;text-align:center}
.metric-label{font-size:11px;color:#999;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.metric-value{font-size:20px;font-weight:600}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.4px;padding:8px 12px;border-bottom:0.5px solid #e0deda;text-align:left;background:#f8f7f4;white-space:nowrap}
td{padding:9px 12px;border-bottom:0.5px solid #e0deda;font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8f7f4}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-green{background:#f0fdf4;color:#16a34a}
.badge-blue{background:#eff6ff;color:#2563eb}
.badge-amber{background:#fffbeb;color:#b45309}
.badge-red{background:#fef2f2;color:#dc2626}
.badge-purple{background:#faf5ff;color:#7c3aed}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:500;color:#5a5a5a;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:7px 10px;border:0.5px solid #cccac4;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;transition:border .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#2563eb}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:#fff;border-radius:12px;width:600px;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-header{padding:18px 20px;border-bottom:0.5px solid #e0deda;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-header h3{font-size:15px;font-weight:600}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:0.5px solid #e0deda;display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff}
.tabs{display:flex;border-bottom:0.5px solid #e0deda;margin-bottom:16px}
.tab{padding:9px 16px;font-size:13px;cursor:pointer;color:#5a5a5a;border-bottom:2px solid transparent;margin-bottom:-0.5px;white-space:nowrap}
.tab.active{color:#2563eb;border-bottom-color:#2563eb;font-weight:500}
.search-bar{display:flex;align-items:center;gap:8px;background:#f8f7f4;border:0.5px solid #e0deda;border-radius:8px;padding:7px 12px;margin-bottom:16px}
.search-bar input{border:none;background:transparent;flex:1;outline:none;font-size:13px}
.chip{display:inline-flex;padding:2px 8px;border-radius:20px;background:#f0efe9;border:0.5px solid #e0deda;font-size:11px;color:#5a5a5a}
.empty-state{text-align:center;padding:48px 24px;color:#999}
.empty-state i{font-size:36px;display:block;margin-bottom:12px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px}
.page-header h1{font-size:16px;font-weight:600}
.est-list-item{padding:12px 16px;border-bottom:0.5px solid #e0deda;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.est-list-item:hover{background:#f8f7f4}
.est-list-item.sel{background:#eff6ff;border-left-color:#2563eb}
.login-screen{position:fixed;inset:0;background:#f0efe9;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200}
.login-box{background:#fff;border:0.5px solid #e0deda;border-radius:16px;padding:36px 40px;width:380px;box-shadow:0 8px 40px rgba(0,0,0,.08)}
.login-profiles{display:flex;gap:12px;margin-bottom:24px}
.profile-btn{flex:1;padding:14px 10px;border-radius:10px;border:2px solid #e0deda;background:#fff;cursor:pointer;text-align:center;transition:all .15s}
.profile-btn:hover,.profile-btn.active{border-color:#2563eb;background:#eff6ff}
.profile-btn i{font-size:24px;display:block;margin-bottom:6px}
.profile-btn span{font-size:12px;font-weight:600;display:block}
.profile-btn small{font-size:11px;color:#999}
.login-err{background:#fef2f2;border:0.5px solid #fca5a5;color:#dc2626;border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:12px}
.folio{font-family:monospace;font-size:12px;font-weight:700;color:#2563eb;background:#eff6ff;padding:2px 8px;border-radius:6px;border:0.5px solid #bfdbfe}
.rol-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.rol-admin{background:#faf5ff;color:#7c3aed;border:0.5px solid #d8b4fe}
.rol-user{background:#eff6ff;color:#2563eb;border:0.5px solid #bfdbfe}
.cat-layout{display:grid;grid-template-columns:1fr 360px;gap:16px;height:calc(100vh - 160px)}
.cat-panel{background:#fff;border:0.5px solid #e0deda;border-radius:12px;overflow:auto}
tr.cat-sel td{background:#eff6ff!important}
.chk-row{display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 10px;border-radius:6px;border:0.5px solid #e0deda;margin-bottom:6px}
.chk-row:hover{background:#f8f7f4}
.chk-row.vigente{border-color:#86efac;background:#f0fdf4}
.chk-box{width:18px;height:18px;border-radius:4px;border:2px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chk-box.on{background:#16a34a;border-color:#16a34a}
.spinning{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

// ⚠️  PEGA AQUÍ LA URL DE TU APPS SCRIPT DESPUÉS DE DESPLEGARLO
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwic-YY1scPw2tQ9BZkiFwMUMfPJ5-eVHv_hhD0F6J-yZ6m536DmyMTQhIi_24_tP5Z/exec';

const SHEETS_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vTnB7hcrgLe977j_vQmi_bWqdsjOTZJhKpy2coyPYSF3nXpnaIA-8I6Hx_OIoTgVGZkXN3mOI-9H8sV/pub?output=csv";
const CAT_HEADERS=['id','Nombre','Categoria','Unidad','Precio','Proveedor','CC'];
const CATS=['Materiales','Acero','Mampostería','Pétreos','Instalaciones','Eléctrico','Mano de Obra','Herramienta','Otro'];

function hashPwd(p){return btoa(unescape(encodeURIComponent(p)));}
const fmt=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n||0);
const fmtN=n=>new Intl.NumberFormat('es-MX').format(n||0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
function genFolio(ests){
  const nums=ests.map(e=>{const m=e.folio?.match(/EST-(\d+)/);return m?parseInt(m[1]):0;});
  return`EST-${String((nums.length?Math.max(...nums):0)+1).padStart(3,'0')}`;
}
function parseCSV(text){
  const lines=text.trim().split('\n');
  const headers=lines[0].split(',').map(h=>h.trim().replace(/"/g,''));
  return lines.slice(1).map(line=>{
    const vals=[];let cur='';let inQ=false;
    for(let c of line){if(c==='"'){inQ=!inQ;}else if(c===','&&!inQ){vals.push(cur.trim());cur='';}else cur+=c;}
    vals.push(cur.trim());
    const obj={};headers.forEach((h,i)=>obj[h]=(vals[i]||'').replace(/"/g,'').trim());
    return obj;
  }).filter(r=>Object.values(r).some(v=>v));
}

// ── API helper ───────────────────────────────────────────────
const hasScript=()=>APPS_SCRIPT_URL&&APPS_SCRIPT_URL!=='PEGA_TU_URL_AQUI';

async function apiGet(action){
  const r=await fetch(`${APPS_SCRIPT_URL}?action=${action}`);
  return r.json();
}
async function apiPost(body){
  const r=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  return r.json();
}

// ── localStorage ─────────────────────────────────────────────
function loadLS(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}}
function saveLS(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

const DEMO=[
  {id:'1',Nombre:'Cemento gris 50kg',Categoria:'Materiales',Unidad:'Saco',Precio:'195.00',Proveedor:'CEMEX',CC:'MAT-001'},
  {id:'2',Nombre:'Varilla 3/8" x 12m',Categoria:'Acero',Unidad:'Pieza',Precio:'285.00',Proveedor:'DEACERO',CC:'ACR-002'},
  {id:'3',Nombre:'Block 15x20x40',Categoria:'Mampostería',Unidad:'Pza',Precio:'12.50',Proveedor:'BLOCKS SA',CC:'MMP-003'},
  {id:'4',Nombre:'Grava 3/4"',Categoria:'Pétreos',Unidad:'M3',Precio:'450.00',Proveedor:'PETREOS NW',CC:'PET-004'},
  {id:'5',Nombre:'Arena limpia',Categoria:'Pétreos',Unidad:'M3',Precio:'380.00',Proveedor:'PETREOS NW',CC:'PET-005'},
  {id:'6',Nombre:'Malla electrosoldada',Categoria:'Acero',Unidad:'Rollo',Precio:'1250.00',Proveedor:'DEACERO',CC:'ACR-006'},
  {id:'7',Nombre:'Tubo PVC 4"x6m',Categoria:'Instalaciones',Unidad:'Pieza',Precio:'195.00',Proveedor:'AMANCO',CC:'INS-007'},
  {id:'8',Nombre:'Cable THW-LS 10AWG',Categoria:'Eléctrico',Unidad:'Metro',Precio:'28.50',Proveedor:'CONDUMEX',CC:'ELE-008'},
];

// ══════════════════════════════════════════════════════════════
// LOGIN
// ══════════════════════════════════════════════════════════════
function LoginScreen({onLogin,creds}){
  const [perfil,setPerfil]=useState('admin');
  const [pwd,setPwd]=useState('');
  const [show,setShow]=useState(false);
  const [err,setErr]=useState('');
  function go(){
    if(hashPwd(pwd)===(creds[perfil]||hashPwd(perfil==='admin'?'admin123':'user123'))){onLogin(perfil);}
    else setErr('Contraseña incorrecta');
  }
  return(
    <div className="login-screen">
      <div className="login-box">
        <div style={{textAlign:'center',marginBottom:24}}>
          <div style={{fontSize:32,marginBottom:8}}>🏗️</div>
          <h2 style={{fontSize:18,fontWeight:700}}>App de Estimaciones</h2>
          <p style={{fontSize:12,color:'#999',marginTop:4}}>Ingresa con tu perfil</p>
        </div>
        <div className="login-profiles">
          <div className={`profile-btn${perfil==='admin'?' active':''}`} onClick={()=>{setPerfil('admin');setPwd('');setErr('');}}>
            <i className="ti ti-shield-check" style={{color:'#7c3aed'}}/>
            <span>Administrador</span><small>Acceso completo</small>
          </div>
          <div className={`profile-btn${perfil==='user'?' active':''}`} onClick={()=>{setPerfil('user');setPwd('');setErr('');}}>
            <i className="ti ti-user" style={{color:'#2563eb'}}/>
            <span>Usuario</span><small>Solo estimaciones</small>
          </div>
        </div>
        {err&&<div className="login-err"><i className="ti ti-alert-circle"/> {err}</div>}
        <div className="form-group" style={{marginBottom:16,position:'relative'}}>
          <label>Contraseña</label>
          <div style={{position:'relative'}}>
            <input type={show?'text':'password'} value={pwd} onChange={e=>{setPwd(e.target.value);setErr('');}} onKeyDown={e=>e.key==='Enter'&&go()} placeholder="Ingresa tu contraseña" style={{paddingRight:36}}/>
            <button onClick={()=>setShow(v=>!v)} style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:'#999',padding:0,fontSize:16}}>
              <i className={`ti ${show?'ti-eye-off':'ti-eye'}`}/>
            </button>
          </div>
        </div>
        <button className="btn btn-primary" style={{width:'100%',justifyContent:'center'}} onClick={go}><i className="ti ti-login"/>Ingresar</button>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// APP
// ══════════════════════════════════════════════════════════════
function App(){
  const [perfil,setPerfil]=useState(null);
  const [view,setView]=useState('dashboard');
  const [catalogo,setCatalogo]=useState([]);
  const [empresa,setEmpresaState]=useState(()=>loadLS('est_empresa',{Nombre_em:'Mi Empresa',Sector:'Construcción',Obra:'',Logo:''}));
  const [estimaciones,setEstimaciones]=useState(()=>loadLS('est_estimaciones',[]));
  const [histPrecios,setHistPrecios]=useState(()=>loadLS('est_histprecios',[]));
  const [creds,setCreds]=useState(()=>loadLS('est_creds',{admin:hashPwd('admin123'),user:hashPwd('user123')}));
  const [syncMsg,setSyncMsg]=useState('');
  const [syncType,setSyncType]=useState('');
  const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(null);

  useEffect(()=>{loadAll();},[]);

  function msg(t,txt,type=''){setSyncMsg(txt);setSyncType(type);if(t)setTimeout(()=>setSyncMsg(''),t);}

  async function loadAll(){
    setLoading(true);msg(0,'Cargando datos...');
    if(hasScript()){
      try{
        const [cats,emp]=await Promise.all([apiGet('getCatalogo'),apiGet('getEmpresa')]);
        if(Array.isArray(cats)&&cats.length>0){setCatalogo(cats);saveLS('est_catalogo',cats);msg(3000,`✓ ${cats.length} productos desde Google Sheets`,'ok');}
        else{setCatalogo(loadLS('est_catalogo',DEMO));msg(3000,'Sheet vacío — usando caché local','');}
        if(emp&&emp.Nombre_em){setEmpresaState(emp);saveLS('est_empresa',emp);}
      }catch{setCatalogo(loadLS('est_catalogo',DEMO));msg(4000,'Sin conexión al script — usando caché','error');}
    } else {
      // Sin Apps Script: leer CSV público (solo lectura)
      try{
        const r=await fetch(SHEETS_CSV);const t=await r.text();
        const d=parseCSV(t);
        if(d.length>0){setCatalogo(d);saveLS('est_catalogo',d);msg(3000,`✓ ${d.length} productos desde Sheet (solo lectura)`,'ok');}
        else{setCatalogo(loadLS('est_catalogo',DEMO));msg(3000,'Sheet vacío — caché local','');}
      }catch{setCatalogo(loadLS('est_catalogo',DEMO));msg(4000,'Sin conexión — datos demo','error');}
    }
    setLoading(false);
  }

  const openModal=(t,d=null)=>setModal({t,d});
  const closeModal=()=>setModal(null);
  const isAdmin=perfil==='admin';

  // ── Estimaciones ──
  function saveEst(e){
    const folio=genFolio(estimaciones);
    const next=e.id?estimaciones.map(x=>x.id===e.id?e:x):[...estimaciones,{...e,id:uid(),folio,fecha:new Date().toLocaleDateString('es-MX'),items:[],total:0}];
    setEstimaciones(next);saveLS('est_estimaciones',next);closeModal();
  }
  function delEst(id){const next=estimaciones.filter(e=>e.id!==id);setEstimaciones(next);saveLS('est_estimaciones',next);}
  function addItem(estId,item){
    const next=estimaciones.map(e=>{
      if(e.id!==estId)return e;
      const items=[...(e.items||[]),{...item,id:uid()}];
      return{...e,items,total:items.reduce((s,i)=>s+(+i.precio*+i.cantidad||0),0)};
    });
    setEstimaciones(next);saveLS('est_estimaciones',next);closeModal();
  }
  function removeItem(estId,itemId){
    const next=estimaciones.map(e=>{
      if(e.id!==estId)return e;
      const items=e.items.filter(i=>i.id!==itemId);
      return{...e,items,total:items.reduce((s,i)=>s+(+i.precio*+i.cantidad||0),0)};
    });
    setEstimaciones(next);saveLS('est_estimaciones',next);
  }

  // ── Precios ──
  function savePrecio(p){
    let next=[...histPrecios];
    if(p.vigente)next=next.map(x=>x.material===p.material&&x.proveedor===p.proveedor?{...x,vigente:false}:x);
    next=[...next,{...p,id:uid(),fecha:new Date().toLocaleDateString('es-MX')}];
    setHistPrecios(next);saveLS('est_histprecios',next);
  }
  function toggleVigente(pid){
    const p=histPrecios.find(x=>x.id===pid);if(!p)return;
    const next=histPrecios.map(x=>x.material===p.material&&x.proveedor===p.proveedor?{...x,vigente:x.id===pid}:x);
    setHistPrecios(next);saveLS('est_histprecios',next);
  }

  // ── Catálogo (con sync a Sheet via Apps Script) ──
  async function addCatItem(item){
    const newItem={...item,id:uid()};
    const next=[...catalogo,newItem];
    setCatalogo(next);saveLS('est_catalogo',next);
    if(hasScript()){
      msg(0,'Guardando en Google Sheets...');
      try{await apiPost({action:'addRow',sheet:'Catalogo',row:newItem,headers:CAT_HEADERS});msg(3000,'✓ Producto guardado en Sheet','ok');}
      catch{msg(4000,'Guardado local — Sheet sin actualizar','error');}
    }
    closeModal();
  }
  async function updateCatItem(item){
    const next=catalogo.map(c=>c.id===item.id?item:c);
    setCatalogo(next);saveLS('est_catalogo',next);
    if(hasScript()){
      msg(0,'Actualizando Google Sheets...');
      try{await apiPost({action:'updateRow',sheet:'Catalogo',id:item.id,row:item,headers:CAT_HEADERS});msg(3000,'✓ Producto actualizado en Sheet','ok');}
      catch{msg(4000,'Actualizado local — Sheet sin actualizar','error');}
    }
    closeModal();
  }
  async function delCatItem(id){
    const next=catalogo.filter(c=>c.id!==id);
    setCatalogo(next);saveLS('est_catalogo',next);
    if(hasScript()){
      msg(0,'Eliminando de Google Sheets...');
      try{await apiPost({action:'deleteRow',sheet:'Catalogo',id});msg(3000,'✓ Producto eliminado del Sheet','ok');}
      catch{msg(4000,'Eliminado local — Sheet sin actualizar','error');}
    }
  }

  // ── Empresa ──
  async function saveEmpresa(e){
    setEmpresaState(e);saveLS('est_empresa',e);
    if(hasScript()){
      msg(0,'Guardando empresa en Sheet...');
      try{await apiPost({action:'saveEmpresa',data:e});msg(3000,'✓ Empresa guardada en Sheet','ok');}
      catch{msg(4000,'Guardado local — Sheet sin actualizar','error');}
    }
  }

  function changeCreds(role,newPwd){
    const next={...creds,[role]:hashPwd(newPwd)};setCreds(next);saveLS('est_creds',next);
  }

  const navAdmin=[
    {id:'dashboard',icon:'ti-dashboard',label:'Dashboard'},
    {id:'estimaciones',icon:'ti-clipboard-list',label:'Estimaciones'},
    {id:'catalogo',icon:'ti-package',label:'Catálogo'},
    {id:'precios',icon:'ti-tags',label:'Historial precios'},
    {id:'reportes',icon:'ti-chart-bar',label:'Reportes'},
    {id:'empresa',icon:'ti-building',label:'Empresa'},
    {id:'seguridad',icon:'ti-lock',label:'Seguridad'},
  ];
  const navUser=[{id:'estimaciones',icon:'ti-clipboard-list',label:'Estimaciones'}];

  if(!perfil)return <LoginScreen onLogin={p=>{setPerfil(p);setView(p==='user'?'estimaciones':'dashboard');}} creds={creds}/>;

  const nav=isAdmin?navAdmin:navUser;
  const safeView=!isAdmin&&view!=='estimaciones'?'estimaciones':view;

  return(
    <div className="app">
      <aside className="sidebar">
        <div className="sidebar-logo">
          {empresa.Logo
            ?<img src={empresa.Logo} alt="logo" style={{height:32,marginBottom:4,objectFit:'contain'}} onError={e=>e.target.style.display='none'}/>
            :<h2>🏗️ {empresa.Nombre_em}</h2>
          }
          <div style={{display:'flex',alignItems:'center',gap:6,marginTop:4}}>
            <span className={`rol-tag ${isAdmin?'rol-admin':'rol-user'}`}>
              <i className={`ti ${isAdmin?'ti-shield-check':'ti-user'}`} style={{fontSize:10}}/>
              {isAdmin?'Admin':'Usuario'}
            </span>
            {hasScript()&&<span title="Conectado a Google Sheets" style={{fontSize:10,color:'#16a34a'}}>☁️</span>}
          </div>
        </div>
        {nav.map(n=>(
          <div key={n.id} className={`nav-item${safeView===n.id?' active':''}`} onClick={()=>setView(n.id)}>
            <i className={`ti ${n.icon}`}/>{n.label}
          </div>
        ))}
        <div style={{flex:1}}/>
        {isAdmin&&<div className="nav-item" onClick={loadAll}><i className="ti ti-refresh"/>Sincronizar</div>}
        <div className="nav-item" style={{color:'#dc2626'}} onClick={()=>{setPerfil(null);setView('dashboard');}}>
          <i className="ti ti-logout"/>Salir
        </div>
      </aside>
      <div className="main">
        {syncMsg&&<div className={`sync-bar${syncType?' '+syncType:''}`}><i className="ti ti-cloud"/>{syncMsg}</div>}
        {!hasScript()&&<div className="sync-bar error"><i className="ti ti-alert-triangle"/>⚠️ Apps Script no configurado — solo lectura. Configura APPS_SCRIPT_URL para escritura en Sheet.</div>}
        {loading
          ?<div style={{display:'flex',alignItems:'center',justifyContent:'center',flex:1,color:'#999',gap:8}}><i className="ti ti-loader spinning" style={{fontSize:20}}/>Cargando...</div>
          :<>
            {safeView==='dashboard'&&<Dashboard est={estimaciones} cat={catalogo} hp={histPrecios} fmt={fmt} fmtN={fmtN} total={estimaciones.reduce((s,e)=>s+(e.total||0),0)} setView={setView} openModal={openModal}/>}
            {safeView==='estimaciones'&&<Estimaciones est={estimaciones} cat={catalogo} hp={histPrecios} fmt={fmt} fmtN={fmtN} openModal={openModal} delEst={delEst} removeItem={removeItem} isAdmin={isAdmin} empresa={empresa}/>}
            {safeView==='catalogo'&&isAdmin&&<Catalogo cat={catalogo} hp={histPrecios} fmt={fmt} savePrecio={savePrecio} toggleVigente={toggleVigente} openModal={openModal} delCatItem={delCatItem} hasScript={hasScript()}/>}
            {safeView==='precios'&&isAdmin&&<HistPrecios hp={histPrecios} cat={catalogo} est={estimaciones} fmt={fmt} fmtN={fmtN} toggleVigente={toggleVigente}/>}
            {safeView==='reportes'&&isAdmin&&<Reportes est={estimaciones} fmt={fmt} fmtN={fmtN}/>}
            {safeView==='empresa'&&isAdmin&&<VistaEmpresa empresa={empresa} onSave={saveEmpresa}/>}
            {safeView==='seguridad'&&isAdmin&&<Seguridad onChangeCreds={changeCreds}/>}
          </>
        }
      </div>
      {modal&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&closeModal()}>
          {modal.t==='nueva-est'&&<ModalNuevaEst estimaciones={estimaciones} onSave={saveEst} onClose={closeModal}/>}
          {modal.t==='add-item'&&<ModalAddItem estId={modal.d} cat={catalogo} hp={histPrecios} onSave={addItem} onClose={closeModal}/>}
          {modal.t==='cat-form'&&<ModalCatForm item={modal.d} onSave={modal.d?updateCatItem:addCatItem} onClose={closeModal}/>}
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════════════════════
function Dashboard({est,cat,hp,fmt,fmtN,total,setView,openModal}){
  const provMap={};
  est.forEach(e=>(e.items||[]).forEach(i=>{
    const p=i.proveedor||'N/A';
    if(!provMap[p])provMap[p]={monto:0,qty:0};
    provMap[p].monto+=(+i.precio*+i.cantidad||0);provMap[p].qty+=(+i.cantidad||0);
  }));
  const topProv=Object.entries(provMap).sort((a,b)=>b[1].monto-a[1].monto).slice(0,5);
  return(
    <div className="content">
      <div className="page-header">
        <h1>Dashboard</h1>
        <button className="btn btn-primary" onClick={()=>openModal('nueva-est')}><i className="ti ti-plus"/>Nueva estimación</button>
      </div>
      <div className="grid-4" style={{marginBottom:20}}>
        {[
          {l:'Estimaciones',v:est.length,i:'ti-clipboard-list',c:'#2563eb'},
          {l:'Total estimado',v:fmt(total),i:'ti-currency-dollar',c:'#16a34a'},
          {l:'Productos catálogo',v:cat.length,i:'ti-package',c:'#b45309'},
          {l:'Precios registrados',v:hp.length,i:'ti-tags',c:'#7c3aed'},
        ].map((m,i)=>(
          <div key={i} className="metric">
            <i className={`ti ${m.i}`} style={{fontSize:24,color:m.c,display:'block',marginBottom:8}}/>
            <div className="metric-label">{m.l}</div>
            <div className="metric-value">{m.v}</div>
          </div>
        ))}
      </div>
      <div className="grid-2">
        <div className="card">
          <p style={{fontWeight:600,fontSize:13,marginBottom:14,color:'#5a5a5a'}}>Últimas estimaciones</p>
          {est.length===0?<div className="empty-state"><i className="ti ti-clipboard-x"/><p>Sin estimaciones</p></div>:
          <table><thead><tr><th>Folio</th><th>Fecha</th><th>Ítems</th><th>Total</th></tr></thead>
          <tbody>{est.slice(-5).reverse().map(e=>(
            <tr key={e.id}><td><span className="folio">{e.folio}</span></td><td style={{color:'#999',fontSize:12}}>{e.fecha}</td><td><span className="badge badge-blue">{e.items?.length||0}</span></td><td style={{fontWeight:600,color:'#16a34a'}}>{fmt(e.total)}</td></tr>
          ))}</tbody></table>}
        </div>
        <div className="card">
          <p style={{fontWeight:600,fontSize:13,marginBottom:14,color:'#5a5a5a'}}>Top proveedores</p>
          {topProv.length===0?<div className="empty-state"><i className="ti ti-truck-off"/><p>Sin datos</p></div>:
          <table><thead><tr><th>Proveedor</th><th>Cant.</th><th>Monto</th></tr></thead>
          <tbody>{topProv.map(([p,v])=>(
            <tr key={p}><td style={{fontWeight:500}}>{p}</td><td>{fmtN(v.qty)}</td><td style={{fontWeight:600,color:'#16a34a'}}>{fmt(v.monto)}</td></tr>
          ))}</tbody></table>}
        </div>
      </div>
    </div>
  );
}

// ESTIMACIONES
// ══════════════════════════════════════════════════════════════
function Estimaciones({est,cat,hp,fmt,fmtN,openModal,delEst,removeItem,isAdmin,empresa}){
  const [sel,setSel]=useState(null);
  const [tab,setTab]=useState('items');
  const s=est.find(e=>e.id===sel);
  const byProv={};const byMat={};
  (s?.items||[]).forEach(i=>{
    const p=i.proveedor||'N/A';const m=i.material||'N/A';
    if(!byProv[p])byProv[p]={qty:0,monto:0};
    byProv[p].qty+=(+i.cantidad||0);byProv[p].monto+=(+i.precio*+i.cantidad||0);
    if(!byMat[m])byMat[m]={qty:0,monto:0,unidad:i.unidad};
    byMat[m].qty+=(+i.cantidad||0);byMat[m].monto+=(+i.precio*+i.cantidad||0);
  });
  return(
    <div className="content">
      <div className="page-header">
        <h1>Estimaciones</h1>
        <button className="btn btn-primary" onClick={()=>openModal('nueva-est')}><i className="ti ti-plus"/>Nueva estimación</button>
      </div>
      <div className="grid-2" style={{height:'calc(100vh - 130px)'}}>
        <div className="card" style={{padding:0,overflow:'auto'}}>
          <div style={{padding:'12px 16px',borderBottom:'0.5px solid #e0deda',fontWeight:600,fontSize:13,color:'#5a5a5a'}}>Listado ({est.length})</div>
          {est.length===0?<div className="empty-state"><i className="ti ti-clipboard-x"/><p>Sin estimaciones</p></div>:
          est.map(e=>(
            <div key={e.id} className={`est-list-item${sel===e.id?' sel':''}`} onClick={()=>{setSel(e.id);setTab('items');}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span className="folio">{e.folio}</span>
                  <span style={{fontSize:11,color:'#999'}}>{e.fecha}</span>
                </div>
                <div style={{textAlign:'right'}}>
                  <p style={{fontWeight:700,color:'#16a34a'}}>{fmt(e.total)}</p>
                  <p style={{fontSize:11,color:'#999'}}>{e.items?.length||0} ítems</p>
                </div>
              </div>
              {sel===e.id&&(
                <div style={{display:'flex',gap:6,marginTop:10}} onClick={ev=>ev.stopPropagation()}>
                  <button className="btn btn-sm btn-primary" onClick={()=>openModal('add-item',e.id)}><i className="ti ti-plus"/>Agregar ítem</button>
                  {isAdmin&&<button className="btn btn-sm btn-danger" onClick={()=>{if(confirm('¿Eliminar?')){delEst(e.id);setSel(null);}}}><i className="ti ti-trash"/></button>}
                </div>
              )}
            </div>
          ))}
        </div>
        <div className="card" style={{padding:0,overflow:'auto'}}>
          {!s?<div className="empty-state"><i className="ti ti-hand-click"/><p>Selecciona una estimación</p></div>:(
            <>
            <div style={{padding:'14px 16px',borderBottom:'0.5px solid #e0deda'}}>
              <div style={{display:'flex',alignItems:'center',gap:10,paddingBottom:10,marginBottom:10,borderBottom:'0.5px solid #e0deda'}}>
                {empresa.Logo&&<img src={empresa.Logo} style={{width:32,height:32,borderRadius:6,objectFit:'cover'}} onError={e=>e.target.style.display='none'}/>}
                <div><p style={{fontWeight:700,fontSize:13}}>{empresa.Nombre_em}</p><p style={{fontSize:11,color:'#999'}}>{empresa.Sector}{empresa.Obra?' · '+empresa.Obra:''}</p></div>
                <div style={{marginLeft:'auto',textAlign:'right'}}><p style={{fontWeight:700,color:'#16a34a',fontSize:15}}>{fmt(s.total)}</p><p style={{fontSize:11,color:'#999'}}>Total</p></div>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                <span className="folio" style={{fontSize:13}}>{s.folio}</span>
                <span style={{fontSize:12,color:'#999'}}>{s.fecha}</span>
              </div>
              <div className="tabs" style={{marginBottom:0}}>
                {[['items','Ítems'],['prov','Por proveedor'],['mat','Por material']].map(([k,l])=>(
                  <div key={k} className={`tab${tab===k?' active':''}`} onClick={()=>setTab(k)}>{l}</div>
                ))}
              </div>
            </div>
            <div style={{padding:16}}>
              {tab==='items'&&((s.items||[]).length===0?<div className="empty-state"><i className="ti ti-package-off"/><p>Sin ítems — agrega uno</p></div>:
                <table><thead><tr><th>Material</th><th>Proveedor</th><th>Und.</th><th>Precio</th><th>Cant.</th><th>Subtotal</th>{isAdmin&&<th></th>}</tr></thead>
                <tbody>{s.items.map(it=>(
                  <tr key={it.id}><td style={{fontWeight:500}}>{it.material}</td><td style={{color:'#5a5a5a'}}>{it.proveedor}</td><td>{it.unidad}</td><td>{fmt(+it.precio)}</td><td>{fmtN(+it.cantidad)}</td><td style={{fontWeight:600,color:'#16a34a'}}>{fmt(+it.precio*+it.cantidad)}</td>
                  {isAdmin&&<td><button className="btn btn-sm btn-danger" onClick={()=>removeItem(s.id,it.id)}><i className="ti ti-trash"/></button></td>}
                  </tr>
                ))}</tbody></table>
              )}
              {tab==='prov'&&(Object.keys(byProv).length===0?<div className="empty-state"><i className="ti ti-truck-off"/><p>Sin datos</p></div>:
                <table><thead><tr><th>Proveedor</th><th>Cant. acum.</th><th>Monto acum.</th></tr></thead>
                <tbody>{Object.entries(byProv).map(([p,v])=>(<tr key={p}><td style={{fontWeight:500}}>{p}</td><td>{fmtN(v.qty)}</td><td style={{fontWeight:600,color:'#16a34a'}}>{fmt(v.monto)}</td></tr>))}</tbody></table>
              )}
              {tab==='mat'&&(Object.keys(byMat).length===0?<div className="empty-state"><i className="ti ti-package-off"/><p>Sin datos</p></div>:
                <table><thead><tr><th>Material</th><th>Und.</th><th>Cant. acum.</th><th>Monto acum.</th></tr></thead>
                <tbody>{Object.entries(byMat).map(([m,v])=>(<tr key={m}><td style={{fontWeight:500}}>{m}</td><td>{v.unidad}</td><td>{fmtN(v.qty)}</td><td style={{fontWeight:600,color:'#16a34a'}}>{fmt(v.monto)}</td></tr>))}</tbody></table>
              )}
            </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// CATÁLOGO
// ══════════════════════════════════════════════════════════════
function Catalogo({cat,hp,fmt,savePrecio,toggleVigente,openModal,delCatItem,hasScript}){
  const [q,setQ]=useState('');
  const [selId,setSelId]=useState(null);
  const [showAddPrecio,setShowAddPrecio]=useState(false);
  const [npForm,setNpForm]=useState({precio:'',notas:'',vigente:true});
  const f=cat.filter(c=>!q||[c.Nombre,c.Proveedor,c.Categoria].some(x=>x?.toLowerCase().includes(q.toLowerCase())));
  const selItem=cat.find(c=>c.id===selId);
  const preciosItem=hp.filter(p=>selItem&&p.material===selItem.Nombre&&p.proveedor===selItem.Proveedor);

  function handleAddPrecio(){
    if(!npForm.precio||!selItem)return;
    savePrecio({material:selItem.Nombre,proveedor:selItem.Proveedor,precio:npForm.precio,notas:npForm.notas,vigente:npForm.vigente});
    setNpForm({precio:'',notas:'',vigente:true});setShowAddPrecio(false);
  }

  return(
    <div className="content">
      <div className="page-header">
        <h1>Catálogo de productos</h1>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <span className="badge badge-blue">{cat.length} productos</span>
          {hasScript?<span className="badge badge-green"><i className="ti ti-cloud"/>Sheet conectado</span>:<span className="badge badge-amber"><i className="ti ti-cloud-off"/>Solo local</span>}
          <button className="btn btn-primary" onClick={()=>openModal('cat-form',null)}><i className="ti ti-plus"/>Nuevo producto</button>
        </div>
      </div>
      <div className="search-bar"><i className="ti ti-search" style={{color:'#999'}}/><input placeholder="Buscar nombre, proveedor, categoría..." value={q} onChange={e=>setQ(e.target.value)}/></div>
      <div className="cat-layout">
        {/* Tabla izquierda */}
        <div className="cat-panel" style={{padding:0}}>
          <table>
            <thead><tr><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Proveedor</th><th>Acciones</th></tr></thead>
            <tbody>
            {f.length===0?<tr><td colSpan={5} style={{textAlign:'center',padding:32,color:'#999'}}>Sin resultados</td></tr>:
            f.map(c=>(
              <tr key={c.id} className={selId===c.id?'cat-sel':''} style={{cursor:'pointer'}} onClick={()=>{setSelId(c.id);setShowAddPrecio(false);}}>
                <td style={{fontWeight:500}}>{c.Nombre}</td>
                <td><span className="chip">{c.Categoria}</span></td>
                <td style={{fontWeight:600,color:'#16a34a'}}>{fmt(+c.Precio||0)}</td>
                <td>{c.Proveedor}</td>
                <td>
                  <div style={{display:'flex',gap:4}} onClick={ev=>ev.stopPropagation()}>
                    <button className="btn btn-sm" title="Editar" onClick={()=>openModal('cat-form',c)}><i className="ti ti-edit"/></button>
                    <button className="btn btn-sm btn-danger" title="Eliminar" onClick={()=>{if(confirm(`¿Eliminar "${c.Nombre}"?`))delCatItem(c.id);}}><i className="ti ti-trash"/></button>
                  </div>
                </td>
              </tr>
            ))}
            </tbody>
          </table>
        </div>
        {/* Panel derecho: precios */}
        <div className="cat-panel" style={{padding:16}}>
          {!selItem?<div className="empty-state"><i className="ti ti-hand-click"/><p>Selecciona un producto para ver y agregar precios</p></div>:(
            <>
            <div style={{marginBottom:14}}>
              <p style={{fontWeight:700,fontSize:14}}>{selItem.Nombre}</p>
              <p style={{fontSize:12,color:'#999',marginTop:2}}>{selItem.Proveedor} · {selItem.Categoria} · {selItem.Unidad}</p>
              <p style={{fontSize:13,color:'#16a34a',fontWeight:600,marginTop:4}}>Precio base: {fmt(+selItem.Precio||0)}</p>
            </div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
              <p style={{fontWeight:600,fontSize:13,color:'#5a5a5a'}}>Historial de precios ({preciosItem.length})</p>
              <button className="btn btn-sm btn-primary" onClick={()=>setShowAddPrecio(v=>!v)}>
                <i className={`ti ${showAddPrecio?'ti-x':'ti-plus'}`}/>{showAddPrecio?'Cancelar':'Agregar precio'}
              </button>
            </div>
            {showAddPrecio&&(
              <div style={{background:'#f8f7f4',borderRadius:8,padding:14,marginBottom:12,border:'0.5px solid #e0deda'}}>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
                  <div className="form-group" style={{marginBottom:0}}><label>Precio *</label><input type="number" step="any" value={npForm.precio} onChange={e=>setNpForm(f=>({...f,precio:e.target.value}))} placeholder="0.00"/></div>
                  <div className="form-group" style={{marginBottom:0}}><label>Notas</label><input value={npForm.notas} onChange={e=>setNpForm(f=>({...f,notas:e.target.value}))} placeholder="Ej: Cot. 30 días"/></div>
                </div>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:8}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}} onClick={()=>setNpForm(f=>({...f,vigente:!f.vigente}))}>
                    <div className={`chk-box${npForm.vigente?' on':''}`}>{npForm.vigente&&<i className="ti ti-check" style={{color:'#fff',fontSize:11}}/>}</div>
                    <span style={{fontSize:12}}>Marcar como vigente</span>
                  </div>
                  <button className="btn btn-sm btn-success" disabled={!npForm.precio} onClick={handleAddPrecio}><i className="ti ti-check"/>Guardar</button>
                </div>
              </div>
            )}
            {preciosItem.length===0?<div style={{textAlign:'center',padding:24,color:'#999',fontSize:13}}>Sin precios registrados</div>:
            preciosItem.sort((a,b)=>b.fecha>a.fecha?1:-1).map(p=>(
              <div key={p.id} className={`chk-row${p.vigente?' vigente':''}`} onClick={()=>toggleVigente(p.id)}>
                <div className={`chk-box${p.vigente?' on':''}`}>{p.vigente&&<i className="ti ti-check" style={{color:'#fff',fontSize:11}}/>}</div>
                <div style={{flex:1}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <span style={{fontWeight:600,color:'#16a34a'}}>{fmt(+p.precio)}</span>
                    {p.vigente&&<span className="badge badge-green" style={{fontSize:10}}>Vigente</span>}
                  </div>
                  <div style={{fontSize:11,color:'#999',marginTop:2}}>{p.fecha}{p.notas&&` · ${p.notas}`}</div>
                </div>
              </div>
            ))}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// HISTORIAL PRECIOS
// ══════════════════════════════════════════════════════════════
function HistPrecios({hp,cat,est,fmt,fmtN,toggleVigente}){
  const [q,setQ]=useState('');
  const f=hp.filter(p=>!q||[p.material,p.proveedor].some(x=>x?.toLowerCase().includes(q.toLowerCase())));
  const acum={};
  est.forEach(e=>(e.items||[]).forEach(i=>{
    const k=`${i.material}||${i.proveedor}||${i.precio}`;
    if(!acum[k])acum[k]={qty:0,monto:0};
    acum[k].qty+=(+i.cantidad||0);acum[k].monto+=(+i.precio*+i.cantidad||0);
  }));
  return(
    <div className="content">
      <div className="page-header"><h1>Historial de precios</h1></div>
      <div className="search-bar"><i className="ti ti-search" style={{color:'#999'}}/><input placeholder="Buscar material o proveedor..." value={q} onChange={e=>setQ(e.target.value)}/></div>
      <div className="card" style={{padding:0}}>
        <table>
          <thead><tr><th>Material</th><th>Proveedor</th><th>Precio</th><th>Fecha</th><th>Vigente</th><th>Cant. acum.</th><th>Monto acum.</th><th>Notas</th></tr></thead>
          <tbody>
          {f.length===0?<tr><td colSpan={8} style={{textAlign:'center',padding:32,color:'#999'}}>{hp.length===0?'Sin precios — agrégalos desde el Catálogo':'Sin resultados'}</td></tr>:
          f.map(p=>{
            const k=`${p.material}||${p.proveedor}||${p.precio}`;const a=acum[k]||{qty:0,monto:0};
            return(<tr key={p.id}>
              <td style={{fontWeight:500}}>{p.material}</td><td>{p.proveedor}</td>
              <td style={{fontWeight:600,color:'#16a34a'}}>{fmt(+p.precio)}</td>
              <td style={{fontSize:12,color:'#999'}}>{p.fecha}</td>
              <td><div className="chk-row" style={{margin:0,border:'none',padding:0}} onClick={()=>toggleVigente(p.id)}><div className={`chk-box${p.vigente?' on':''}`}>{p.vigente&&<i className="ti ti-check" style={{color:'#fff',fontSize:11}}/>}</div>{p.vigente&&<span className="badge badge-green" style={{fontSize:10}}>Vigente</span>}</div></td>
              <td>{a.qty>0?fmtN(a.qty):'—'}</td>
              <td style={{fontWeight:600,color:a.monto>0?'#2563eb':'#999'}}>{a.monto>0?fmt(a.monto):'—'}</td>
              <td style={{fontSize:12,color:'#999'}}>{p.notas||'—'}</td>
            </tr>);
          })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// REPORTES
// ══════════════════════════════════════════════════════════════
function Reportes({est,fmt,fmtN}){
  const byProv={};const byCat={};
  est.forEach(e=>(e.items||[]).forEach(i=>{
    const p=i.proveedor||'N/A';const c=i.categoria||'N/A';
    if(!byProv[p])byProv[p]={qty:0,monto:0,ests:new Set()};
    byProv[p].qty+=(+i.cantidad||0);byProv[p].monto+=(+i.precio*+i.cantidad||0);byProv[p].ests.add(e.id);
    if(!byCat[c])byCat[c]={qty:0,monto:0};
    byCat[c].qty+=(+i.cantidad||0);byCat[c].monto+=(+i.precio*+i.cantidad||0);
  }));
  const tot=Object.values(byProv).reduce((s,v)=>s+v.monto,0);
  return(
    <div className="content">
      <div className="page-header"><h1>Reportes acumulados</h1></div>
      <div className="grid-2">
        <div className="card">
          <p style={{fontWeight:600,fontSize:13,marginBottom:14,color:'#5a5a5a'}}>Acumulado por proveedor</p>
          {Object.keys(byProv).length===0?<div className="empty-state" style={{padding:24}}><i className="ti ti-chart-off"/><p>Sin datos</p></div>:
          <table><thead><tr><th>Proveedor</th><th>Est.</th><th>Cant.</th><th>Monto</th><th>%</th></tr></thead>
          <tbody>{Object.entries(byProv).sort((a,b)=>b[1].monto-a[1].monto).map(([p,v])=>(
            <tr key={p}><td style={{fontWeight:500}}>{p}</td><td><span className="badge badge-blue">{v.ests.size}</span></td><td>{fmtN(v.qty)}</td><td style={{fontWeight:600,color:'#16a34a'}}>{fmt(v.monto)}</td><td style={{fontSize:12,color:'#999'}}>{tot>0?((v.monto/tot)*100).toFixed(1)+'%':'—'}</td></tr>
          ))}</tbody></table>}
        </div>
        <div className="card">
          <p style={{fontWeight:600,fontSize:13,marginBottom:14,color:'#5a5a5a'}}>Acumulado por categoría</p>
          {Object.keys(byCat).length===0?<div className="empty-state" style={{padding:24}}><i className="ti ti-chart-off"/><p>Sin datos</p></div>:
          <table><thead><tr><th>Categoría</th><th>Cant.</th><th>Monto</th><th>%</th></tr></thead>
          <tbody>{Object.entries(byCat).sort((a,b)=>b[1].monto-a[1].monto).map(([c,v])=>(
            <tr key={c}><td><span className="chip">{c}</span></td><td>{fmtN(v.qty)}</td><td style={{fontWeight:600,color:'#16a34a'}}>{fmt(v.monto)}</td><td style={{fontSize:12,color:'#999'}}>{tot>0?((v.monto/tot)*100).toFixed(1)+'%':'—'}</td></tr>
          ))}</tbody></table>}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// EMPRESA
// ══════════════════════════════════════════════════════════════
function VistaEmpresa({empresa,onSave}){
  const [f,setF]=useState({...empresa});
  const [saved,setSaved]=useState(false);
  const fileRef=useRef();
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  function handleFile(e){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();r.onload=ev=>{s('Logo',ev.target.result);};r.readAsDataURL(file);
  }
  function handleSave(){onSave(f);setSaved(true);setTimeout(()=>setSaved(false),2500);}
  return(
    <div className="content">
      <div className="page-header"><h1>Datos de empresa</h1></div>
      <div className="grid-2">
        <div className="card">
          <div className="form-group"><label>Nombre de la empresa</label><input value={f.Nombre_em||''} onChange={e=>s('Nombre_em',e.target.value)}/></div>
          <div className="form-group"><label>Sector</label><input value={f.Sector||''} onChange={e=>s('Sector',e.target.value)}/></div>
          <div className="form-group"><label>Obra / Proyecto actual</label><input value={f.Obra||''} onChange={e=>s('Obra',e.target.value)}/></div>
          <div className="form-group">
            <label>Logo</label>
            <div style={{display:'flex',gap:8}}>
              <input value={typeof f.Logo==='string'&&f.Logo.length<200?f.Logo:''} onChange={e=>s('Logo',e.target.value)} placeholder="URL de imagen"/>
              <button className="btn btn-sm" onClick={()=>fileRef.current.click()}><i className="ti ti-upload"/>Subir</button>
              <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleFile}/>
            </div>
          </div>
          <button className="btn btn-primary" style={{width:'100%',justifyContent:'center'}} onClick={handleSave}>
            {saved?<><i className="ti ti-check"/>¡Guardado!</>:<><i className="ti ti-device-floppy"/>Guardar cambios</>}
          </button>
        </div>
        <div className="card">
          <p style={{fontWeight:600,fontSize:13,marginBottom:14,color:'#5a5a5a'}}>Vista previa del encabezado</p>
          <div style={{border:'1px solid #e0deda',borderRadius:10,overflow:'hidden'}}>
            <div style={{background:'linear-gradient(135deg,#1e3a5f,#2563eb)',padding:'16px 20px',display:'flex',alignItems:'center',gap:14}}>
              {f.Logo?<img src={f.Logo} style={{width:48,height:48,borderRadius:8,objectFit:'cover',background:'#fff'}} onError={e=>e.target.style.display='none'}/>
                :<div style={{width:48,height:48,borderRadius:8,background:'rgba(255,255,255,.15)',display:'flex',alignItems:'center',justifyContent:'center'}}><i className="ti ti-building" style={{color:'#fff',fontSize:22}}/></div>}
              <div>
                <p style={{color:'#fff',fontWeight:700,fontSize:15}}>{f.Nombre_em||'Nombre empresa'}</p>
                <p style={{color:'rgba(255,255,255,.7)',fontSize:12,marginTop:2}}>{f.Sector||'Sector'}</p>
              </div>
            </div>
            <div style={{padding:'10px 20px',background:'#f8f7f4',borderTop:'2px solid #2563eb',display:'flex',justifyContent:'space-between',fontSize:12}}>
              <span><span style={{color:'#999'}}>Obra: </span><strong>{f.Obra||'—'}</strong></span>
              <span><span style={{color:'#999'}}>Fecha: </span><strong>{new Date().toLocaleDateString('es-MX')}</strong></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// SEGURIDAD
// ══════════════════════════════════════════════════════════════
function Seguridad({onChangeCreds}){
  const [form,setForm]=useState({admin:'',user:''});
  const [ok,setOk]=useState({});
  function change(role){
    if(!form[role]||form[role].length<4)return alert('Mínimo 4 caracteres');
    onChangeCreds(role,form[role]);
    setOk(o=>({...o,[role]:true}));setForm(f=>({...f,[role]:''}));
    setTimeout(()=>setOk(o=>({...o,[role]:false})),2000);
  }
  return(
    <div className="content">
      <div className="page-header"><h1>Seguridad</h1></div>
      <div className="grid-2">
        {[{role:'admin',label:'Administrador',color:'#7c3aed'},{role:'user',label:'Usuario',color:'#2563eb'}].map(({role,label,color})=>(
          <div key={role} className="card">
            <p style={{fontWeight:600,fontSize:13,marginBottom:14,color}}><i className={`ti ${role==='admin'?'ti-shield-check':'ti-user'}`} style={{marginRight:6}}/>{label}</p>
            <div className="form-group"><label>Nueva contraseña (mín. 4 caracteres)</label><input type="password" value={form[role]} onChange={e=>setForm(f=>({...f,[role]:e.target.value}))} placeholder="Nueva contraseña"/></div>
            <button className={`btn ${ok[role]?'btn-success':'btn-primary'}`} onClick={()=>change(role)} style={{width:'100%',justifyContent:'center'}}>
              {ok[role]?<><i className="ti ti-check"/>Cambiada</>:<><i className="ti ti-lock"/>Cambiar contraseña</>}
            </button>
          </div>
        ))}
      </div>
      <div className="card" style={{marginTop:16,background:'#fffbeb',border:'0.5px solid #fde68a'}}>
        <p style={{fontSize:12,color:'#92400e'}}><i className="ti ti-info-circle" style={{marginRight:6}}/>Las contraseñas se guardan cifradas en tu navegador. Si limpias el caché del navegador se restablecen a los valores por defecto (<strong>admin123</strong> / <strong>user123</strong>).</p>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// MODAL: NUEVA ESTIMACIÓN — solo folio
// ══════════════════════════════════════════════════════════════
function ModalNuevaEst({estimaciones,onSave,onClose}){
  const folio=genFolio(estimaciones);
  return(
    <div className="modal" style={{width:400}}>
      <div className="modal-header"><h3>Nueva estimación</h3><button className="btn btn-sm" onClick={onClose}><i className="ti ti-x"/></button></div>
      <div className="modal-body">
        <div style={{textAlign:'center',padding:'12px 0 20px'}}>
          <p style={{fontSize:12,color:'#999',marginBottom:8}}>Se generará el siguiente folio:</p>
          <span className="folio" style={{fontSize:22,padding:'8px 24px'}}>{folio}</span>
        </div>
        <div style={{background:'#f8f7f4',borderRadius:8,padding:'10px 14px',fontSize:12,color:'#5a5a5a'}}>
          <i className="ti ti-info-circle" style={{marginRight:6}}/>El folio se genera automáticamente de forma consecutiva. Podrás agregar ítems a esta estimación una vez creada.
        </div>
      </div>
      <div className="modal-footer">
        <button className="btn" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={()=>onSave({folio})}><i className="ti ti-check"/>Crear estimación</button>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// MODAL: AGREGAR ÍTEM
// ══════════════════════════════════════════════════════════════
function ModalAddItem({estId,cat,hp,onSave,onClose}){
  const [selId,setSelId]=useState('');
  const [cant,setCant]=useState('');
  const [precioOv,setPrecioOv]=useState('');
  const item=cat.find(c=>c.id===selId);
  const vigente=item?hp.find(p=>p.material===item.Nombre&&p.proveedor===item.Proveedor&&p.vigente):null;
  const precioBase=precioOv||(vigente?.precio)||(item?.Precio)||'';
  return(
    <div className="modal">
      <div className="modal-header"><h3>Agregar ítem a estimación</h3><button className="btn btn-sm" onClick={onClose}><i className="ti ti-x"/></button></div>
      <div className="modal-body">
        <div className="form-group"><label>Producto *</label>
          <select value={selId} onChange={e=>setSelId(e.target.value)}>
            <option value="">— Selecciona un producto —</option>
            {cat.map((c,i)=><option key={i} value={c.id}>{c.Nombre} · {c.Proveedor}</option>)}
          </select>
        </div>
        {item&&(
          <div style={{background:'#f8f7f4',borderRadius:8,padding:'10px 14px',marginBottom:14,fontSize:12,display:'flex',gap:14,flexWrap:'wrap',alignItems:'center'}}>
            <span><span style={{color:'#999'}}>Cat.:</span> {item.Categoria}</span>
            <span><span style={{color:'#999'}}>Und.:</span> {item.Unidad}</span>
            <span><span style={{color:'#999'}}>C.C:</span> {item.CC}</span>
            <span><span style={{color:'#999'}}>Precio base:</span> <strong style={{color:'#16a34a'}}>{fmt(+item.Precio||0)}</strong></span>
            {vigente&&<span className="badge badge-green"><i className="ti ti-check"/>Vigente: {fmt(+vigente.precio)}</span>}
          </div>
        )}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div className="form-group"><label>Cantidad *</label><input type="number" min="0" step="any" value={cant} onChange={e=>setCant(e.target.value)} placeholder="0"/></div>
          <div className="form-group"><label>Precio unitario</label><input type="number" step="any" value={precioOv} onChange={e=>setPrecioOv(e.target.value)} placeholder={precioBase||'0.00'}/></div>
        </div>
        {item&&cant&&<div style={{background:'#f0fdf4',borderRadius:8,padding:'10px 14px',border:'0.5px solid #86efac'}}>
          <strong style={{color:'#16a34a'}}>Subtotal: {fmt((+precioBase||0)*(+cant||0))}</strong>
        </div>}
      </div>
      <div className="modal-footer">
        <button className="btn" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!item||!cant} onClick={()=>onSave(estId,{material:item.Nombre,proveedor:item.Proveedor,unidad:item.Unidad,precio:precioBase,cantidad:cant,categoria:item.Categoria,cc:item.CC})}>Agregar</button>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// MODAL: AGREGAR / EDITAR PRODUCTO CATÁLOGO
// ══════════════════════════════════════════════════════════════
function ModalCatForm({item,onSave,onClose}){
  const [f,setF]=useState(item?{...item}:{id:'',Nombre:'',Categoria:'',Unidad:'',Precio:'',Proveedor:'',CC:''});
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  const isNew=!item;
  return(
    <div className="modal">
      <div className="modal-header"><h3>{isNew?'Nuevo producto':'Editar producto'}</h3><button className="btn btn-sm" onClick={onClose}><i className="ti ti-x"/></button></div>
      <div className="modal-body">
        <div className="form-group"><label>Nombre *</label><input value={f.Nombre} onChange={e=>s('Nombre',e.target.value)} placeholder="Nombre del producto"/></div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div className="form-group"><label>Categoría *</label>
            <select value={f.Categoria} onChange={e=>s('Categoria',e.target.value)}>
              <option value="">— Selecciona —</option>
              {CATS.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div className="form-group"><label>Unidad *</label><input value={f.Unidad} onChange={e=>s('Unidad',e.target.value)} placeholder="M3, Pieza, Saco..."/></div>
          <div className="form-group"><label>Precio base *</label><input type="number" step="any" value={f.Precio} onChange={e=>s('Precio',e.target.value)} placeholder="0.00"/></div>
          <div className="form-group"><label>Proveedor</label><input value={f.Proveedor} onChange={e=>s('Proveedor',e.target.value)} placeholder="Nombre del proveedor"/></div>
        </div>
        <div className="form-group"><label>C.C (Centro de costo)</label><input value={f.CC} onChange={e=>s('CC',e.target.value)} placeholder="MAT-001"/></div>
      </div>
      <div className="modal-footer">
        <button className="btn" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!f.Nombre||!f.Categoria||!f.Unidad||!f.Precio} onClick={()=>onSave(f)}>
          {isNew?<><i className="ti ti-plus"/>Agregar al catálogo</>:<><i className="ti ti-check"/>Guardar cambios</>}
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
