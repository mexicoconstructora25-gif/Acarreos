<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0efe9;color:#1a1a1a;font-size:14px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:0.5px solid #cccac4;background:#fff;color:#1a1a1a;font-size:13px;cursor:pointer;transition:all .15s}
.btn:hover{background:#f0efe9}

.card{background:#fff;border:0.5px solid #e0deda;border-radius:12px;padding:20px}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}

.badge-blue{background:#eff6ff;color:#2563eb}

.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:500;color:#5a5a5a;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:7px 10px;border:0.5px solid #cccac4;border-radius:8px;background:#fff;color:#1a1a1a;outline:none}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:12px;width:560px;max-height:85vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:18px 20px;border-bottom:0.5px solid #e0deda;display:flex;align-items:center;justify-content:space-between}

.modal-footer{padding:14px 20px;border-top:0.5px solid #e0deda;display:flex;justify-content:flex-end;gap:8px}
.tabs{display:flex;border-bottom:0.5px solid #e0deda;margin-bottom:16px}
.tab{padding:9px 16px;font-size:13px;cursor:pointer;color:#5a5a5a;border-bottom:2px solid transparent;margin-bottom:-0.5px}
.tab.active{color:#2563eb;border-bottom-color:#2563eb;font-weight:500}
.search-bar{display:flex;align-items:center;gap:8px;background:#f8f7f4;border:0.5px solid #e0deda;border-radius:8px;padding:7px 12px;margin-bottom:16px}
.search-bar input{border:none;background:transparent;flex:1;outline:none;font-size:13px}
.chip{display:inline-flex;padding:2px 8px;border-radius:20px;background:#f0efe9;border:0.5px solid #e0deda;font-size:11px;color:#5a5a5a}

/* LOGIN */

/* Panel empresa */
.empresa-preview{background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);border-radius:12px;padding:24px;color:#fff;margin-bottom:20px}
/* Catálogo con panel lateral */
.cat-layout{display:grid;grid-template-columns:1fr 380px;gap:16px;height:calc(100vh - 150px)}
.cat-panel{background:#fff;border:0.5px solid #e0deda;border-radius:12px;overflow:auto}
tr.cat-sel td{background:#eff6ff!important}
.chk-row{display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 10px;border-radius:6px;border:0.5px solid #e0deda;margin-bottom:6px}

.chk-row.vigente{border-color:#86efac;background:#f0fdf4}
.chk-box{width:18px;height:18px;border-radius:4px;border:2px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chk-box.on{background:#16a34a;border-color:#16a34a}
.rol-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.rol-admin{background:#faf5ff;color:#7c3aed;border:0.5px solid #d8b4fe}
.rol-user{background:#eff6ff;color:#2563eb;border:0.5px solid #bfdbfe}
/* folio badge */
.folio{font-family:monospace;font-size:12px;font-weight:700;color:#2563eb;background:#eff6ff;padding:2px 8px;border-radius:6px;border:0.5px solid #bfdbfe}
/* inline edit */
.inline-edit{border:none;background:transparent;width:100%;outline:none;font-size:13px;font-family:inherit;padding:2px 4px}
.inline-edit:focus{background:#fffbeb;border-radius:4px;outline:0.5px solid #fcd34d}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;
const SHEETS_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vTnB7hcrgLe977j_vQmi_bWqdsjOTZJhKpy2coyPYSF3nXpnaIA-8I6Hx_OIoTgVGZkXN3mOI-9H8sV/pub?output=csv";

// ⚠️ Pega aquí la URL de tu Apps Script desplegado
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbwSlsb2-rVkuLXFddyz-qa32-Khv1YPsbY0dhORCAD2U1nk2bqoJb8I0MFLGIvtyN-M/exec';
const hasScript=()=>!!(APPS_SCRIPT_URL&&APPS_SCRIPT_URL.startsWith('https://script.google.com/'));
const CAT_HEADERS=['id','Nombre','Categoria','Unidad','Precio','Proveedor','CC'];
async function apiPost(body){
  const r=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  return r.json();
}

// ── Contraseñas por defecto (hash simple: btoa) ──────────────────────────────
const DEFAULT_CREDS={admin:'admin123',user:'user123'};

function hashPwd(p){return btoa(unescape(encodeURIComponent(p)));}

function parseCSV(text){
  const lines=text.trim().split('\n');
  const headers=lines[0].split(',').map(h=>h.trim().replace(/"/g,''));
  return lines.slice(1).map(line=>{
    const vals=[];let cur='';let inQ=false;
    for(let c of line){if(c==='"'){inQ=!inQ;}else if(c===','&&!inQ){vals.push(cur.trim());cur='';}else cur+=c;}
    vals.push(cur.trim());
    const obj={};headers.forEach((h,i)=>obj[h]=(vals[i]||'').replace(/"/g,'').trim());
    return obj;
  }).filter(r=>Object.values(r).some(v=>v));
}

const fmt=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n||0);
const fmtN=n=>new Intl.NumberFormat('es-MX').format(n||0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);

// Genera folio consecutivo EST-001, EST-002 …
function genFolio(estimaciones){
  const nums=estimaciones.map(e=>{
    const m=e.folio?.match(/EST-(\d+)/);
    return m?parseInt(m[1]):0;
  });
  const next=(nums.length?Math.max(...nums):0)+1;
  return`EST-${String(next).padStart(3,'0')}`;
}

// Exporta catálogo local a CSV descargable
function exportCSV(rows){
  const heads=['Nombre','Categoria','Unidad','Precio','Proveedor','CC'];
  const lines=[heads.join(','),...rows.map(r=>heads.map(h=>`"${(r[h]||'').toString().replace(/"/g,'""')}"`).join(','))];
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='catalogo_estimaciones.csv';a.click();
}

const DEMO=[
  {id:'1',Nombre:'Cemento gris 50kg',Categoria:'Materiales',Unidad:'Saco',Precio:'195.00',Proveedor:'CEMEX',CC:'MAT-001'},
  {id:'2',Nombre:'Varilla 3/8" x 12m',Categoria:'Acero',Unidad:'Pieza',Precio:'285.00',Proveedor:'DEACERO',CC:'ACR-002'},
  {id:'3',Nombre:'Block 15x20x40',Categoria:'Mampostería',Unidad:'Pza',Precio:'12.50',Proveedor:'BLOCKS SA',CC:'MMP-003'},
  {id:'4',Nombre:'Grava 3/4"',Categoria:'Pétreos',Unidad:'M3',Precio:'450.00',Proveedor:'PETREOS NW',CC:'PET-004'},
  {id:'5',Nombre:'Arena limpia',Categoria:'Pétreos',Unidad:'M3',Precio:'380.00',Proveedor:'PETREOS NW',CC:'PET-005'},
  {id:'6',Nombre:'Malla electrosoldada 6-6',Categoria:'Acero',Unidad:'Rollo',Precio:'1250.00',Proveedor:'DEACERO',CC:'ACR-006'},
  {id:'7',Nombre:'Tubo PVC 4" x 6m',Categoria:'Instalaciones',Unidad:'Pieza',Precio:'195.00',Proveedor:'AMANCO',CC:'INS-007'},
  {id:'8',Nombre:'Cable THW-LS 10AWG',Categoria:'Eléctrico',Unidad:'Metro',Precio:'28.50',Proveedor:'CONDUMEX',CC:'ELE-008'},
];

// ══════════════════════════════════════════════════════════════════════════════
// PANTALLA DE LOGIN
// ══════════════════════════════════════════════════════════════════════════════
function LoginScreen({onLogin,creds}){
  const [perfil,setPerfil]=useState('admin');
  const [pwd,setPwd]=useState('');
  const [showPwd,setShowPwd]=useState(false);
  const [err,setErr]=useState('');

  function handleLogin(){
    const expected=creds[perfil]||hashPwd(DEFAULT_CREDS[perfil]);
    if(hashPwd(pwd)===expected){
      setErr('');onLogin(perfil);
    }else{
      setErr('Contraseña incorrecta. Intenta de nuevo.');
    }
  }

  return(
    <div className="login-screen">
      <div className="login-box">
        <div style={{textAlign:'center',marginBottom:24}}>
          <div style={{fontSize:28,marginBottom:8}}>🏗️</div>
          <h2 style={{fontSize:18,fontWeight:700}}>App de Estimaciones</h2>
          <p style={{fontSize:12,color:'#999',marginTop:4}}>Ingresa con tu perfil</p>
        </div>
        <div className="login-profiles">
          <div className={`profile-btn${perfil==='admin'?' active':''}`} onClick={()=>{setPerfil('admin');setPwd('');setErr('');}}>
            <i className="ti ti-shield-check" style={{color:'#7c3aed'}}/>
            <span>Administrador</span>
            <small>Acceso completo</small>
          </div>
          <div className={`profile-btn${perfil==='user'?' active':''}`} onClick={()=>{setPerfil('user');setPwd('');setErr('');}}>
            <i className="ti ti-user" style={{color:'#2563eb'}}/>
            <span>Usuario</span>
            <small>Solo estimaciones</small>
          </div>
        </div>
        {err&&<div className="login-err"><i className="ti ti-alert-circle"/> {err}</div>}
        <div className="form-group" style={{marginBottom:16,position:'relative'}}>
          <label>Contraseña</label>
          <div style={{position:'relative'}}>
            <input
              type={showPwd?'text':'password'}
              value={pwd}
              onChange={e=>{setPwd(e.target.value);setErr('');}}
              onKeyDown={e=>e.key==='Enter'&&handleLogin()}
              placeholder="Ingresa tu contraseña"
              style={{paddingRight:36}}
            />
            <button onClick={()=>setShowPwd(v=>!v)} style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:'#999',padding:0,fontSize:16}}>
              <i className={`ti ${showPwd?'ti-eye-off':'ti-eye'}`}/>
            </button>
          </div>
        </div>
        <button className="btn btn-primary" style={{width:'100%',justifyContent:'center'}} onClick={handleLogin}>
          <i className="ti ti-login"/>Ingresar
        </button>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// APP PRINCIPAL
// ══════════════════════════════════════════════════════════════════════════════
function App(){
  const [perfil,setPerfil]=useState(null);
  const [view,setView]=useState('dashboard');
  const [catalogo,setCatalogo]=useState([]);
  const [loading,setLoading]=useState(true);
  const [syncMsg,setSyncMsg]=useState('');
  const [modal,setModal]=useState(null);
  const [estimaciones,setEstimaciones]=useState([]);
  const [histPrecios,setHistPrecios]=useState([]);
  const [empresa,setEmpresa]=useState({nombre:'Mi Empresa Constructora',sector:'Construcción',obra:'',logo:null,telefono:'',correo:'',direccion:''});
  const [catalogoExtra,setCatalogoExtra]=useState([]);
  // Contraseñas hasheadas
  const [creds,setCreds]=useState({admin:hashPwd('admin123'),user:hashPwd('user123')});
  const [sheetOk,setSheetOk]=useState(false);

  useEffect(()=>{
    const saved=localStorage.getItem('estimaciones_v1');
    if(saved){
      const d=JSON.parse(saved);
      setEstimaciones(d.est||[]);
      setHistPrecios(d.hp||[]);
      if(d.empresa)setEmpresa(d.empresa);
      if(d.catalogo_extra)setCatalogoExtra(d.catalogo_extra||[]);
      if(d.creds)setCreds(d.creds);
    }
    loadSheet();
  },[]);

  function saveAll(overrides={}){
    const state={
      est:estimaciones,hp:histPrecios,empresa,
      catalogo_extra:catalogoExtra,creds,
      ...overrides
    };
    localStorage.setItem('estimaciones_v1',JSON.stringify(state));
  }

  async function loadSheet(){
    setLoading(true);setSyncMsg('Conectando con Google Sheets...');
    // Intentar cargar via Apps Script (JSON, datos frescos)
    // Si falla por CORS, usar CSV publicado como fallback
    let loaded=false;
    if(hasScript()){
      try{
        const r=await fetch(APPS_SCRIPT_URL+'?action=getcatalogo');
        const text=await r.text();
        const d=JSON.parse(text);
        if(Array.isArray(d)){
          const clean=d.filter(x=>Object.values(x).some(v=>v));
          setCatalogo(clean);
          setSheetOk(true);
          const ids=new Set(clean.map(x=>String(x.id)));
          setCatalogoExtra(prev=>{
            const cleaned=prev.filter(x=>!ids.has(String(x.id)));
            saveAll({catalogo_extra:cleaned});
            return cleaned;
          });
          setSyncMsg('✓ '+clean.length+' productos cargados desde Google Sheets');
          loaded=true;
        }
      }catch(e){
        console.warn('Apps Script GET falló, intentando CSV:',e.message);
      }
    }
    // Fallback: CSV publicado
    if(!loaded){
      try{
        const r=await fetch(SHEETS_CSV);
        if(!r.ok)throw new Error();
        const t=await r.text();
        const d=parseCSV(t);
        if(d.length>0){
          setCatalogo(d);
          setSheetOk(true);
          const ids=new Set(d.map(x=>String(x.id||x.Nombre)));
          setCatalogoExtra(prev=>{
            const cleaned=prev.filter(x=>!ids.has(String(x.id))&&!ids.has(String(x.Nombre)));
            saveAll({catalogo_extra:cleaned});
            return cleaned;
          });
          setSyncMsg('✓ '+d.length+' productos cargados (CSV)');
          loaded=true;
        } else {
          setCatalogo([]);setSheetOk(true);setSyncMsg('Sheet vacío');loaded=true;
        }
      }catch(e2){
        console.warn('CSV fallback también falló:',e2.message);
      }
    }
    if(!loaded){
      setCatalogo(DEMO);setSheetOk(false);
      setSyncMsg('Sin conexión — mostrando datos demo');
    }
    setLoading(false);
    setTimeout(()=>setSyncMsg(''),5000);
  }

  const openModal=(t,d=null)=>setModal({t,d});
  const closeModal=()=>setModal(null);

  function saveEst(e){
    const folio=e.folio||genFolio(estimaciones);
    const next=e.id
      ?estimaciones.map(x=>x.id===e.id?{...e,folio}:x)
      :[...estimaciones,{...e,id:uid(),folio,fecha:new Date().toLocaleDateString('es-MX'),items:[],total:0}];
    setEstimaciones(next);saveAll({est:next});closeModal();
  }
  function delEst(id){const next=estimaciones.filter(e=>e.id!==id);setEstimaciones(next);saveAll({est:next});}
  function addItem(estId,item){
    const next=estimaciones.map(e=>{
      if(e.id!==estId)return e;
      const items=[...(e.items||[]),{...item,id:uid()}];
      return{...e,items,total:items.reduce((s,i)=>s+(+i.precio*+i.cantidad||0),0)};
    });
    setEstimaciones(next);saveAll({est:next});closeModal();
  }
  function removeItem(estId,itemId){
    const next=estimaciones.map(e=>{
      if(e.id!==estId)return e;
      const items=e.items.filter(i=>i.id!==itemId);
      return{...e,items,total:items.reduce((s,i)=>s+(+i.precio*+i.cantidad||0),0)};
    });
    setEstimaciones(next);saveAll({est:next});
  }
  function savePrecio(p){
    let next=[...histPrecios];
    if(p.vigente)next=next.map(x=>x.material===p.material&&x.proveedor===p.proveedor?{...x,vigente:false}:x);
    next=[...next,{...p,id:uid(),fecha:new Date().toLocaleDateString('es-MX')}];
    setHistPrecios(next);saveAll({hp:next});closeModal();
  }
  function toggleVigente(pid){
    const p=histPrecios.find(x=>x.id===pid);if(!p)return;
    const next=histPrecios.map(x=>x.material===p.material&&x.proveedor===p.proveedor?{...x,vigente:x.id===pid}:x);
    setHistPrecios(next);saveAll({hp:next});
  }
  function saveEmpresa(e){setEmpresa(e);saveAll({empresa:e});closeModal();}

  async function saveNuevoConcepto(c){
    // Generar ID consecutivo formato E00001
    const allIds=[...catalogo,...catalogoExtra].map(x=>x.id||'').filter(x=>/^E\d+$/.test(x));
    const maxNum=allIds.length>0?Math.max(...allIds.map(x=>parseInt(x.slice(1),10))):0;
    const newId='E'+String(maxNum+1).padStart(5,'0');
    const newItem={...c,id:newId,fuente:'local'};
    const next=[...catalogoExtra,newItem];
    setCatalogoExtra(next);saveAll({catalogo_extra:next});closeModal();
    if(hasScript()){
      try{await apiPost({action:'addRow',sheet:'catalogo',row:newItem,headers:CAT_HEADERS});}
      catch(e){console.warn('Sheet sync error:',e);}
    }
  }

  async function updateConcepto(id,datos){
    const isLocal=catalogoExtra.some(c=>c.id===id);
    const isSheet=catalogo.some(c=>c.id===id);
    if(isLocal){
      // Actualizar en catalogoExtra local
      const next=catalogoExtra.map(c=>c.id===id?{...c,...datos}:c);
      setCatalogoExtra(next);saveAll({catalogo_extra:next});
      if(hasScript()){
        const item=next.find(c=>c.id===id);
        if(item)try{await apiPost({action:'updateRow',sheet:'catalogo',id,row:item,headers:CAT_HEADERS});}
        catch(e){console.warn('Sheet sync error:',e);}
      }
    } else if(isSheet){
      // Item del Sheet: actualizar en Sheet directamente
      const original=catalogo.find(c=>c.id===id);
      const updated={...original,...datos};
      setCatalogo(prev=>prev.map(c=>c.id===id?updated:c));
      if(hasScript()){
        try{
          const r=await apiPost({action:'updateRow',sheet:'catalogo',id,row:updated,headers:CAT_HEADERS});
          if(r&&r.ok){setSyncMsg('✓ Cambios guardados en Google Sheets');}
          else{setSyncMsg('⚠️ Error al guardar: '+(r&&r.error||'sin respuesta'));}
          setTimeout(()=>setSyncMsg(''),4000);
        }catch(e){console.warn('Sheet sync error:',e);}
      }
    }
    closeModal();
  }

  async function delConcepto(id){
    const isLocal=catalogoExtra.some(c=>c.id===id);
    const next=catalogoExtra.filter(c=>c.id!==id);
    setCatalogoExtra(next);saveAll({catalogo_extra:next});
    if(isLocal||catalogo.some(c=>c.id===id)){
      // Si también estaba en el Sheet cargado, quitarlo del estado
      setCatalogo(prev=>prev.filter(c=>c.id!==id));
      if(hasScript()){
        try{await apiPost({action:'deleteRow',sheet:'catalogo',id});}
        catch(e){console.warn('Sheet sync error:',e);}
      }
    }
  }
  function changeCreds(role,newPwd){
    const next={...creds,[role]:hashPwd(newPwd)};
    setCreds(next);saveAll({creds:next});
  }

  // Deduplicar: el Sheet tiene prioridad; catalogoExtra solo agrega items que no existen en el Sheet
  const sheetIds=new Set(catalogo.map(c=>c.id||c.Nombre));
  const extraFiltrado=catalogoExtra.filter(c=>!sheetIds.has(c.id)&&!sheetIds.has(c.Nombre));
  const catTotal=[...catalogo,...extraFiltrado];
  const totalEstimado=estimaciones.reduce((s,e)=>s+(e.total||0),0);

  const navAdmin=[
    {id:'dashboard',icon:'ti-dashboard',label:'Dashboard'},
    {id:'estimaciones',icon:'ti-clipboard-list',label:'Estimaciones'},
    {id:'catalogo',icon:'ti-package',label:'Catálogo'},
    {id:'precios',icon:'ti-tags',label:'Historial precios'},
    {id:'reportes',icon:'ti-chart-bar',label:'Reportes'},
    {id:'empresa',icon:'ti-building',label:'Empresa'},
    {id:'seguridad',icon:'ti-lock',label:'Seguridad'},
  ];
  const navUser=[{id:'estimaciones',icon:'ti-clipboard-list',label:'Estimaciones'}];
  const nav=perfil==='admin'?navAdmin:navUser;

  if(!perfil) return <LoginScreen onLogin={p=>{setPerfil(p);setView(p==='user'?'estimaciones':'dashboard');}} creds={creds}/>;

  return(
    <div className="app">
      <aside className="sidebar">
        <div className="sidebar-logo">
          {empresa.logo
            ?<img src={empresa.logo} alt="logo" style={{height:32,marginBottom:4,objectFit:'contain'}}/>
            :<h2>🏗️ {empresa.nombre}</h2>
          }
          <div style={{display:'flex',alignItems:'center',gap:6,marginTop:4}}>
            <span className={`rol-tag ${perfil==='admin'?'rol-admin':'rol-user'}`}>
              <i className={`ti ${perfil==='admin'?'ti-shield-check':'ti-user'}`} style={{fontSize:10}}/>
              {perfil==='admin'?'Admin':'Usuario'}
            </span>
          </div>
        </div>
        {nav.map(n=>(
          <div key={n.id} className={`nav-item${view===n.id?' active':''}`} onClick={()=>setView(n.id)}>
            <i className={`ti ${n.icon}`}/>{n.label}
          </div>
        ))}
        <div style={{flex:1}}/>
        {perfil==='admin'&&<div className="nav-item" onClick={loadSheet}><i className="ti ti-refresh"/>Sincronizar Sheet</div>}
        {perfil==='admin'&&<div className="nav-item" style={{color:'#ef4444',fontSize:12}} onClick={()=>{if(confirm('¿Limpiar todos los datos locales? Esto elimina el catálogo local y recarga desde el Sheet.')){localStorage.removeItem('estimaciones_v1');setCatalogoExtra([]);loadSheet();}}}><i className="ti ti-trash"/>Limpiar local</div>}
        <div className="nav-item" style={{color:'#dc2626'}} onClick={()=>{setPerfil(null);setView('dashboard');}}>
          <i className="ti ti-logout"/>Salir
        </div>
      </aside>
      <div className="main">
        {syncMsg&&<div className="sync-bar"><i className="ti ti-cloud"/>{syncMsg}</div>}

        {loading
          ?<div style={{display:'flex',alignItems:'center',justifyContent:'center',flex:1,color:'#999',gap:8}}><i className="ti ti-loader" style={{fontSize:20}}/>Cargando...</div>
          :<>
            {view==='dashboard'&&<Dashboard est={estimaciones} cat={catTotal} hp={histPrecios} fmt={fmt} fmtN={fmtN} total={totalEstimado} setView={setView} openModal={openModal}/>}
            {view==='estimaciones'&&<Estimaciones est={estimaciones} cat={catTotal} hp={histPrecios} fmt={fmt} fmtN={fmtN} openModal={openModal} delEst={delEst} removeItem={removeItem} perfil={perfil}/>}
            {view==='catalogo'&&perfil==='admin'&&<Catalogo cat={catTotal} catalogoExtra={catalogoExtra} fmt={fmt} hp={histPrecios} savePrecio={savePrecio} toggleVigente={toggleVigente} openModal={openModal} delConcepto={delConcepto} updateConcepto={updateConcepto} sheetOk={sheetOk}/>}
            {view==='precios'&&perfil==='admin'&&<HistPrecios hp={histPrecios} cat={catTotal} est={estimaciones} fmt={fmt} fmtN={fmtN} openModal={openModal} toggleVigente={toggleVigente}/>}
            {view==='reportes'&&perfil==='admin'&&<Reportes est={estimaciones} fmt={fmt} fmtN={fmtN}/>}
            {view==='empresa'&&perfil==='admin'&&<VistaEmpresa empresa={empresa} onSave={saveEmpresa}/>}
            {view==='seguridad'&&perfil==='admin'&&<Seguridad onChangeCreds={changeCreds}/>}
          </>
        }
      </div>
      {modal&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&closeModal()}>
          {modal.t==='nueva-est'&&<ModalNuevaEst estimaciones={estimaciones} onSave={saveEst} onClose={closeModal}/>}
          {modal.t==='add-item'&&<ModalAddItem estId={modal.d} cat={catTotal} hp={histPrecios} onSave={addItem} onClose={closeModal}/>}
          {modal.t==='nuevo-precio'&&<ModalNuevoPrecio cat={catTotal} onSave={savePrecio} onClose={closeModal}/>}
          {modal.t==='nuevo-concepto'&&<ModalConcepto item={null} onSave={saveNuevoConcepto} onClose={closeModal} sheetOk={sheetOk}/>}
          {modal.t==='edit-concepto'&&<ModalConcepto item={modal.d} onSave={datos=>updateConcepto(modal.d.id,datos)} onClose={closeModal} sheetOk={sheetOk}/>}
        </div>
      )}
    </div>
  );
}

// DASHBOARD
// ══════════════════════════════════════════════════════════════════════════════
function Dashboard({est,cat,hp,fmt,fmtN,total,setView,openModal}){
  const provMap={};
  est.forEach(e=>(e.items||[]).forEach(i=>{
    const p=i.proveedor||'N/A';
    if(!provMap[p])provMap[p]={monto:0,qty:0};
    provMap[p].monto+=(+i.precio*+i.cantidad||0);
    provMap[p].qty+=(+i.cantidad||0);
  }));
  const topProv=Object.entries(provMap).sort((a,b)=>b[1].monto-a[1].monto).slice(0,5);
  return(
    <div className="content">
      <div className="page-header">
        <h1>Dashboard</h1>
        <button className="btn btn-primary" onClick={()=>openModal('nueva-est')}><i className="ti ti-plus"/>Nueva estimación</button>
      </div>
      <div className="grid-4" style={{marginBottom:20}}>
        {[
          {l:'Estimaciones',v:est.length,i:'ti-clipboard-list',c:'#2563eb'},
          {l:'Total estimado',v:fmt(total),i:'ti-currency-dollar',c:'#16a34a'},
          {l:'Productos catálogo',v:cat.length,i:'ti-package',c:'#b45309'},
          {l:'Precios registrados',v:hp.length,i:'ti-tags',c:'#7c3aed'},
        ].map((m,i)=>(
          <div key={i} className="metric">
            <i className={`ti ${m.i}`} style={{fontSize:24,color:m.c,display:'block',marginBottom:8}}/>
            <div className="metric-label">{m.l}</div>
            <div className="metric-value">{m.v}</div>
          </div>
        ))}
      </div>
      <div className="grid-2">
        <div className="card">
          <p style={{fontWeight:600,fontSize:13,marginBottom:14,color:'#5a5a5a'}}>Últimas estimaciones</p>
          {est.length===0
            ?<div className="empty-state"><i className="ti ti-clipboard-x"/><p>Sin estimaciones aún</p></div>
            :<table><thead><tr><th>Folio</th><th>Nombre</th><th>Fecha</th><th>Total</th></tr></thead>
              <tbody>{est.slice(-5).reverse().map(e=>(
                <tr key={e.id}>
                  <td><span className="folio">{e.folio||'—'}</span></td>
                  <td style={{fontWeight:500}}>{e.nombre}</td>
                  <td style={{color:'#999',fontSize:12}}>{e.fecha}</td>
                  <td style={{fontWeight:600,color:'#16a34a'}}>{fmt(e.total)}</td>
                </tr>
              ))}</tbody></table>
          }
        </div>
        <div className="card">
          <p style={{fontWeight:600,fontSize:13,marginBottom:14,color:'#5a5a5a'}}>Top proveedores por monto</p>
          {topProv.length===0
            ?<div className="empty-state"><i className="ti ti-truck-off"/><p>Sin datos aún</p></div>
            :<table><thead><tr><th>Proveedor</th><th>Cant.</th><th>Monto</th></tr></thead>
              <tbody>{topProv.map(([p,v])=>(
                <tr key={p}><td style={{fontWeight:500}}>{p}</td><td>{fmtN(v.qty)}</td><td style={{fontWeight:600,color:'#16a34a'}}>{fmt(v.monto)}</td></tr>
              ))}</tbody></table>
          }
        </div>
      </div>
    </div>
  );
}

// ESTIMACIONES
// ══════════════════════════════════════════════════════════════════════════════
function Estimaciones({est,cat,hp,fmt,fmtN,openModal,delEst,removeItem,perfil}){
  const [sel,setSel]=useState(null);
  const [tab,setTab]=useState('items');
  const s=est.find(e=>e.id===sel);
  const isAdmin=perfil==='admin';
  const byProv={};const byMat={};
  (s?.items||[]).forEach(i=>{
    const p=i.proveedor||'N/A';const m=i.material||'N/A';
    if(!byProv[p])byProv[p]={qty:0,monto:0};
    byProv[p].qty+=(+i.cantidad||0);byProv[p].monto+=(+i.precio*+i.cantidad||0);
    if(!byMat[m])byMat[m]={qty:0,monto:0,unidad:i.unidad};
    byMat[m].qty+=(+i.cantidad||0);byMat[m].monto+=(+i.precio*+i.cantidad||0);
  });

  return(
    <div className="content">
      <div className="page-header">
        <h1>Estimaciones</h1>
        <button className="btn btn-primary" onClick={()=>openModal('nueva-est')}><i className="ti ti-plus"/>Nueva estimación</button>
      </div>
      <div className="grid-2" style={{height:'calc(100vh - 130px)'}}>
        <div className="card" style={{padding:0,overflow:'auto'}}>
          <div style={{padding:'12px 16px',borderBottom:'0.5px solid #e0deda',fontWeight:600,fontSize:13,color:'#5a5a5a'}}>
            Listado ({est.length})
          </div>
          {est.length===0
            ?<div className="empty-state"><i className="ti ti-clipboard-x"/><p>Sin estimaciones</p></div>
            :est.map(e=>(
              <div key={e.id} className={`est-list-item${sel===e.id?' sel':''}`} onClick={()=>{setSel(e.id);setTab('items');}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                  <div>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:2}}>
                      <span className="folio">{e.folio||'—'}</span>
                      <p style={{fontWeight:500,fontSize:13}}>{e.nombre}</p>
                    </div>
                    <p style={{fontSize:11,color:'#999'}}>{e.obra||'Sin obra'} · {e.fecha}</p>
                  </div>
                  <div style={{textAlign:'right'}}>
                    <p style={{fontWeight:700,color:'#16a34a'}}>{fmt(e.total)}</p>
                    <p style={{fontSize:11,color:'#999'}}>{e.items?.length||0} ítems</p>
                  </div>
                </div>
                {sel===e.id&&(
                  <div style={{display:'flex',gap:6,marginTop:10}} onClick={ev=>ev.stopPropagation()}>
                    <button className="btn btn-sm btn-primary" onClick={()=>openModal('add-item',e.id)}><i className="ti ti-plus"/>Agregar ítem</button>
                    {isAdmin&&<button className="btn btn-sm btn-danger" onClick={()=>{if(confirm('¿Eliminar estimación?')){delEst(e.id);setSel(null);}}}><i className="ti ti-trash"/></button>}
                  </div>
                )}
              </div>
            ))
          }
        </div>
        <div className="card" style={{padding:0,overflow:'auto'}}>
          {!s
            ?<div className="empty-state"><i className="ti ti-hand-click"/><p>Selecciona una estimación</p></div>
            :<>
              <div style={{padding:'14px 16px',borderBottom:'0.5px solid #e0deda'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
                  <div>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                      <span className="folio" style={{fontSize:13}}>{s.folio}</span>
                    </div>
                    <p style={{fontWeight:600,fontSize:14}}>{s.nombre}</p>
                    <p style={{fontSize:11,color:'#999'}}>{s.obra} · {s.fecha}</p>
                  </div>
                  <div style={{textAlign:'right'}}>
                    <p style={{fontWeight:700,color:'#16a34a',fontSize:16}}>{fmt(s.total)}</p>
                    <p style={{fontSize:11,color:'#999'}}>Total</p>
                  </div>
                </div>
                <div className="tabs" style={{marginBottom:0}}>
                  {[['items','Ítems'],['prov','Por proveedor'],['mat','Por material']].map(([k,l])=>(
                    <div key={k} className={`tab${tab===k?' active':''}`} onClick={()=>setTab(k)}>{l}</div>
                  ))}
                </div>
              </div>
              <div style={{padding:16}}>
                {tab==='items'&&(
                  (s.items||[]).length===0
                    ?<div className="empty-state"><i className="ti ti-package-off"/><p>Sin ítems — agrega uno</p></div>
                    :<table>
                      <thead><tr><th>Material</th><th>Proveedor</th><th>Und.</th><th>Precio</th><th>Cant.</th><th>Subtotal</th>{isAdmin&&<th></th>}</tr></thead>
                      <tbody>{s.items.map(it=>(
                        <tr key={it.id}>
                          <td style={{fontWeight:500}}>{it.material}</td>
                          <td style={{color:'#5a5a5a'}}>{it.proveedor}</td>
                          <td>{it.unidad}</td>
                          <td>{fmt(+it.precio)}</td>
                          <td>{fmtN(+it.cantidad)}</td>
                          <td style={{fontWeight:600,color:'#16a34a'}}>{fmt(+it.precio*+it.cantidad)}</td>
                          {isAdmin&&<td><button className="btn btn-sm btn-danger" onClick={()=>removeItem(s.id,it.id)}><i className="ti ti-trash"/></button></td>}
                        </tr>
                      ))}</tbody>
                    </table>
                )}
                {tab==='prov'&&(Object.keys(byProv).length===0
                  ?<div className="empty-state"><i className="ti ti-truck-off"/><p>Sin datos</p></div>
                  :<table><thead><tr><th>Proveedor</th><th>Cant.</th><th>Monto</th></tr></thead>
                    <tbody>{Object.entries(byProv).map(([p,v])=>(<tr key={p}><td style={{fontWeight:500}}>{p}</td><td>{fmtN(v.qty)}</td><td style={{fontWeight:600,color:'#16a34a'}}>{fmt(v.monto)}</td></tr>))}</tbody>
                  </table>
                )}
                {tab==='mat'&&(Object.keys(byMat).length===0
                  ?<div className="empty-state"><i className="ti ti-package-off"/><p>Sin datos</p></div>
                  :<table><thead><tr><th>Material</th><th>Unidad</th><th>Cant.</th><th>Monto</th></tr></thead>
                    <tbody>{Object.entries(byMat).map(([m,v])=>(<tr key={m}><td style={{fontWeight:500}}>{m}</td><td>{v.unidad}</td><td>{fmtN(v.qty)}</td><td style={{fontWeight:600,color:'#16a34a'}}>{fmt(v.monto)}</td></tr>))}</tbody>
                  </table>
                )}
              </div>
            </>
          }
        </div>
      </div>
    </div>
  );
}

// CATÁLOGO con edición inline y panel de precios
// ══════════════════════════════════════════════════════════════════════════════
function Catalogo({cat,catalogoExtra,fmt,hp,savePrecio,toggleVigente,openModal,delConcepto,updateConcepto,sheetOk}){
  const [q,setQ]=useState('');
  const [selId,setSelId]=useState(null);
  const [showAddPrecio,setShowAddPrecio]=useState(false);
  const [npForm,setNpForm]=useState({precio:'',notas:'',vigente:true});

  const f=cat.filter(c=>!q||[c.Nombre,c.Proveedor,c.Categoria].some(x=>x?.toLowerCase().includes(q.toLowerCase())));
  const selItem=cat.find(c=>c.id===selId);
  const preciosItem=selItem?hp.filter(p=>p.material===selItem.Nombre&&p.proveedor===selItem.Proveedor):[];

  function handleAddPrecio(){
    if(!npForm.precio||!selItem)return;
    savePrecio({material:selItem.Nombre,proveedor:selItem.Proveedor,precio:npForm.precio,notas:npForm.notas,vigente:npForm.vigente});
    setNpForm({precio:'',notas:'',vigente:true});setShowAddPrecio(false);
  }

  return(
    <div className="content" style={{paddingBottom:0}}>
      <div className="page-header">
        <h1>Catálogo de productos</h1>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <span className="badge badge-blue">{cat.length} productos</span>
          {sheetOk
            ?<span className="badge badge-green"><i className="ti ti-cloud"/>Sheet conectado</span>
            :<span className="badge badge-amber"><i className="ti ti-cloud-off"/>Solo local</span>
          }
          <button className="btn btn-primary" onClick={()=>openModal('nuevo-concepto')}><i className="ti ti-plus"/>Nuevo concepto</button>
        </div>
      </div>
      <div className="search-bar"><i className="ti ti-search" style={{color:'#999'}}/><input placeholder="Buscar nombre, proveedor, categoría..." value={q} onChange={e=>setQ(e.target.value)}/></div>
      <div className="cat-layout">
        <div className="cat-panel" style={{padding:0}}>
          <table>
            <thead><tr><th>Nombre</th><th>Categoría</th><th>Unidad</th><th>Precio</th><th>Proveedor</th><th>C.C</th><th style={{width:90}}>Acciones</th></tr></thead>
            <tbody>
              {f.length===0
                ?<tr><td colSpan={7} style={{textAlign:'center',padding:32,color:'#999'}}>Sin resultados</td></tr>
                :f.map((c,i)=>{
                  const local=catalogoExtra.some(x=>x.id===c.id);
                  return(
                    <tr key={i} className={selId===c.id?'cat-sel':''} style={{cursor:'pointer'}} onClick={()=>{setSelId(c.id);setShowAddPrecio(false);}}>
                      <td style={{fontWeight:500}}>
                        {c.Nombre}
                        {local&&<span className="badge badge-amber" style={{marginLeft:6,fontSize:10}}>Local</span>}
                      </td>
                      <td><span className="chip">{c.Categoria}</span></td>
                      <td>{c.Unidad}</td>
                      <td style={{fontWeight:600,color:'#16a34a'}}>{fmt(+c.Precio||0)}</td>
                      <td>{c.Proveedor}</td>
                      <td style={{fontSize:12,color:'#999'}}>{c.CC}</td>
                      <td>
                        <div style={{display:'flex',gap:4}} onClick={ev=>ev.stopPropagation()}>
                          <button className="btn btn-sm" title="Editar" onClick={()=>openModal('edit-concepto',c)}>
                            <i className="ti ti-edit"/>
                          </button>
                          <button className="btn btn-sm btn-danger" title="Eliminar" onClick={()=>{if(confirm(`¿Eliminar "${c.Nombre}" del catálogo?`))delConcepto(c.id);}}>
                            <i className="ti ti-trash"/>
                          </button>
                        </div>
                      </td>
                    </tr>
                  );
                })
              }
            </tbody>
          </table>
        </div>
        {/* Panel derecho: precios */}
        <div className="cat-panel" style={{padding:16}}>
          {!selItem
            ?<div className="empty-state"><i className="ti ti-hand-click"/><p>Selecciona un producto para gestionar sus precios</p></div>
            :<>
              <div style={{marginBottom:16}}>
                <p style={{fontWeight:600,fontSize:14}}>{selItem.Nombre}</p>
                <p style={{fontSize:12,color:'#999',marginTop:2}}>{selItem.Proveedor} · {selItem.Categoria} · {selItem.Unidad}</p>
                <p style={{fontSize:13,color:'#16a34a',fontWeight:600,marginTop:4}}>Precio catálogo: {fmt(+selItem.Precio||0)}</p>
              </div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
                <p style={{fontWeight:600,fontSize:13,color:'#5a5a5a'}}>Historial ({preciosItem.length})</p>
                <button className="btn btn-sm btn-primary" onClick={()=>setShowAddPrecio(v=>!v)}>
                  <i className={`ti ${showAddPrecio?'ti-x':'ti-plus'}`}/>{showAddPrecio?'Cancelar':'Agregar precio'}
                </button>
              </div>
              {showAddPrecio&&(
                <div style={{background:'#f8f7f4',borderRadius:8,padding:14,marginBottom:12,border:'0.5px solid #e0deda'}}>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
                    <div className="form-group" style={{marginBottom:0}}>
                      <label>Precio unitario *</label>
                      <input type="number" step="any" value={npForm.precio} onChange={e=>setNpForm(f=>({...f,precio:e.target.value}))} placeholder="0.00"/>
                    </div>
                    <div className="form-group" style={{marginBottom:0}}>
                      <label>Notas</label>
                      <input value={npForm.notas} onChange={e=>setNpForm(f=>({...f,notas:e.target.value}))} placeholder="Ej: Cot. 30 días"/>
                    </div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:8}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}} onClick={()=>setNpForm(f=>({...f,vigente:!f.vigente}))}>

                  <div key={p.id} className={`chk-row${p.vigente?' vigente':''}`} onClick={()=>toggleVigente(p.id)}>

                    <div style={{flex:1}}>
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                        <span style={{fontWeight:600,color:'#16a34a'}}>{fmt(+p.precio)}</span>

                    </div>
                  </div>
                ))

            </>
          }
        </div>
      </div>
    </div>
  );
}

// HISTORIAL PRECIOS
// ══════════════════════════════════════════════════════════════════════════════
function HistPrecios({hp,cat,est,fmt,fmtN,openModal,toggleVigente}){
  const [q,setQ]=useState('');
  const f=hp.filter(p=>!q||[p.material,p.proveedor].some(x=>x?.toLowerCase().includes(q.toLowerCase())));
  const acum={};
  est.forEach(e=>(e.items||[]).forEach(i=>{
    const k=`${i.material}||${i.proveedor}||${i.precio}`;
    if(!acum[k])acum[k]={qty:0,monto:0};
    acum[k].qty+=(+i.cantidad||0);acum[k].monto+=(+i.precio*+i.cantidad||0);
  }));
  return(
    <div className="content">
      <div className="page-header">
        <h1>Historial de precios</h1>
        <button className="btn btn-primary" onClick={()=>openModal('nuevo-precio')}><i className="ti ti-plus"/>Registrar precio</button>
      </div>
      <div className="search-bar"><i className="ti ti-search" style={{color:'#999'}}/><input placeholder="Buscar material o proveedor..." value={q} onChange={e=>setQ(e.target.value)}/></div>
      <div className="card" style={{padding:0}}>
        <table>
          <thead><tr><th>Material</th><th>Proveedor</th><th>Precio</th><th>Fecha</th><th>Vigente</th><th>Cant. acum.</th><th>Monto acum.</th><th>Notas</th></tr></thead>
          <tbody>
            {f.length===0
              ?<tr><td colSpan={8} style={{textAlign:'center',padding:32,color:'#999'}}>{hp.length===0?'Sin precios registrados':'Sin resultados'}</td></tr>
              :f.map(p=>{
                const k=`${p.material}||${p.proveedor}||${p.precio}`;
                const a=acum[k]||{qty:0,monto:0};
                return(
                  <tr key={p.id}>
                    <td style={{fontWeight:500}}>{p.material}</td>
                    <td>{p.proveedor}</td>
                    <td style={{fontWeight:600,color:'#16a34a'}}>{fmt(+p.precio)}</td>
                    <td style={{fontSize:12,color:'#999'}}>{p.fecha}</td>
                    <td>
                      <div style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}} onClick={()=>toggleVigente(p.id)}>
                        <div style={{width:18,height:18,borderRadius:4,border:`2px solid ${p.vigente?'#16a34a':'#ccc'}`,background:p.vigente?'#16a34a':'transparent',display:'flex',alignItems:'center',justifyContent:'center'}}>
                          {p.vigente&&<i className="ti ti-check" style={{color:'#fff',fontSize:11}}/>}
                        </div>
                        {p.vigente&&<span className="badge badge-green">Vigente</span>}
                      </div>
                    </td>
                    <td>{a.qty>0?fmtN(a.qty):'—'}</td>
                    <td style={{fontWeight:600,color:a.monto>0?'#2563eb':'#999'}}>{a.monto>0?fmt(a.monto):'—'}</td>
                    <td style={{fontSize:12,color:'#999'}}>{p.notas||'—'}</td>
                  </tr>
                );
              })
            }
          </tbody>
        </table>
      </div>
    </div>
  );
}

// REPORTES
// ══════════════════════════════════════════════════════════════════════════════
function Reportes({est,fmt,fmtN}){
  const byProv={};const byCat={};
  est.forEach(e=>(e.items||[]).forEach(i=>{
    const p=i.proveedor||'N/A';const c=i.categoria||'N/A';
    if(!byProv[p])byProv[p]={qty:0,monto:0,ests:new Set()};
    byProv[p].qty+=(+i.cantidad||0);byProv[p].monto+=(+i.precio*+i.cantidad||0);byProv[p].ests.add(e.id);
    if(!byCat[c])byCat[c]={qty:0,monto:0};
    byCat[c].qty+=(+i.cantidad||0);byCat[c].monto+=(+i.precio*+i.cantidad||0);
  }));
  const totMonto=Object.values(byProv).reduce((s,v)=>s+v.monto,0);
  return(
    <div className="content">
      <div className="page-header"><h1>Reportes acumulados</h1></div>
      <div className="grid-2" style={{marginBottom:16}}>
        <div className="card">
          <p style={{fontWeight:600,fontSize:13,marginBottom:14,color:'#5a5a5a'}}>Por proveedor</p>
          {Object.keys(byProv).length===0
            ?<div className="empty-state" style={{padding:24}}><i className="ti ti-chart-off"/><p>Sin datos</p></div>
            :<table>
              <thead><tr><th>Proveedor</th><th>Estimaciones</th><th>Cant.</th><th>Monto</th><th>%</th></tr></thead>
              <tbody>{Object.entries(byProv).sort((a,b)=>b[1].monto-a[1].monto).map(([p,v])=>(
                <tr key={p}><td style={{fontWeight:500}}>{p}</td><td><span className="badge badge-blue">{v.ests.size}</span></td><td>{fmtN(v.qty)}</td><td style={{fontWeight:600,color:'#16a34a'}}>{fmt(v.monto)}</td><td style={{fontSize:12,color:'#999'}}>{totMonto>0?((v.monto/totMonto)*100).toFixed(1)+'%':'—'}</td></tr>
              ))}</tbody>
            </table>
          }
        </div>
        <div className="card">
          <p style={{fontWeight:600,fontSize:13,marginBottom:14,color:'#5a5a5a'}}>Por categoría</p>
          {Object.keys(byCat).length===0
            ?<div className="empty-state" style={{padding:24}}><i className="ti ti-chart-off"/><p>Sin datos</p></div>
            :<table>
              <thead><tr><th>Categoría</th><th>Cant.</th><th>Monto</th><th>%</th></tr></thead>
              <tbody>{Object.entries(byCat).sort((a,b)=>b[1].monto-a[1].monto).map(([c,v])=>(
                <tr key={c}><td><span className="chip">{c}</span></td><td>{fmtN(v.qty)}</td><td style={{fontWeight:600,color:'#16a34a'}}>{fmt(v.monto)}</td><td style={{fontSize:12,color:'#999'}}>{totMonto>0?((v.monto/totMonto)*100).toFixed(1)+'%':'—'}</td></tr>
              ))}</tbody>
            </table>
          }
        </div>
      </div>
      <div className="card">
        <p style={{fontWeight:600,fontSize:13,marginBottom:14,color:'#5a5a5a'}}>Resumen de estimaciones</p>
        {est.length===0
          ?<div className="empty-state" style={{padding:24}}><i className="ti ti-clipboard-x"/><p>Sin estimaciones</p></div>
          :<table>
            <thead><tr><th>Folio</th><th>Estimación</th><th>Obra</th><th>Fecha</th><th>Ítems</th><th>Total</th></tr></thead>
            <tbody>{est.map(e=>{
              return(<tr key={e.id}>
                <td><span className="folio">{e.folio||'—'}</span></td>
                <td style={{fontWeight:500}}>{e.nombre}</td>
                <td>{e.obra||'—'}</td>
                <td style={{color:'#999',fontSize:12}}>{e.fecha}</td>
                <td><span className="badge badge-blue">{e.items?.length||0}</span></td>
                <td style={{fontWeight:700,color:'#16a34a'}}>{fmt(e.total)}</td>
              </tr>);
            })}</tbody>
          </table>
        }
      </div>
    </div>
  );
}

// SEGURIDAD — cambiar contraseñas
// ══════════════════════════════════════════════════════════════════════════════
function Seguridad({onChangeCreds}){
  const [tab,setTab]=useState('admin');
  const [f,setF]=useState({actual:'',nueva:'',confirmar:''});
  const [show,setShow]=useState({actual:false,nueva:false,confirmar:false});
  const [msg,setMsg]=useState(null); // {type:'ok'|'err', text}
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  const tog=(k)=>setShow(x=>({...x,[k]:!x[k]}));

  function handleSave(){
    if(!f.nueva||f.nueva.length<4){setMsg({type:'err',text:'La nueva contraseña debe tener al menos 4 caracteres.'});return;}
    if(f.nueva!==f.confirmar){setMsg({type:'err',text:'Las contraseñas no coinciden.'});return;}
    onChangeCreds(tab,f.nueva);
    setMsg({type:'ok',text:`Contraseña de ${tab==='admin'?'Administrador':'Usuario'} actualizada correctamente.`});
    setF({actual:'',nueva:'',confirmar:''});
  }

  function PwdInput({label,field}){
    return(
      <div className="form-group">
        <label>{label}</label>
        <div style={{position:'relative'}}>
          <input type={show[field]?'text':'password'} value={f[field]} onChange={e=>s(field,e.target.value)} style={{paddingRight:36}}/>
          <button onClick={()=>tog(field)} style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:'#999',padding:0,fontSize:16}}>
            <i className={`ti ${show[field]?'ti-eye-off':'ti-eye'}`}/>
          </button>
        </div>
      </div>
    );
  }

  return(
    <div className="content">
      <div className="page-header"><h1>Seguridad — Contraseñas</h1></div>
      <div style={{maxWidth:480}}>
        <div className="card">
          <div className="tabs">
            <div className={`tab${tab==='admin'?' active':''}`} onClick={()=>{setTab('admin');setF({actual:'',nueva:'',confirmar:''});setMsg(null);}}>
              <i className="ti ti-shield-check" style={{marginRight:6}}/>Administrador
            </div>
            <div className={`tab${tab==='user'?' active':''}`} onClick={()=>{setTab('user');setF({actual:'',nueva:'',confirmar:''});setMsg(null);}}>
              <i className="ti ti-user" style={{marginRight:6}}/>Usuario
            </div>
          </div>
          {msg&&(
            <div style={{
              background:msg.type==='ok'?'#f0fdf4':'#fef2f2',
              border:`0.5px solid ${msg.type==='ok'?'#86efac':'#fca5a5'}`,
              color:msg.type==='ok'?'#16a34a':'#dc2626',
              borderRadius:8,padding:'8px 12px',fontSize:12,marginBottom:14,display:'flex',alignItems:'center',gap:6
            }}>
              <i className={`ti ${msg.type==='ok'?'ti-circle-check':'ti-alert-circle'}`}/>{msg.text}
            </div>
          )}
          <PwdInput label="Nueva contraseña *" field="nueva"/>
          <PwdInput label="Confirmar contraseña *" field="confirmar"/>
          <div style={{background:'#f8f7f4',borderRadius:8,padding:'10px 14px',marginBottom:14,fontSize:12,color:'#5a5a5a'}}>
            <i className="ti ti-info-circle" style={{marginRight:6,color:'#2563eb'}}/>
            Cambia la contraseña del perfil <strong>{tab==='admin'?'Administrador':'Usuario'}</strong>. Mínimo 4 caracteres.
          </div>
          <button className="btn btn-primary" disabled={!f.nueva||!f.confirmar} onClick={handleSave}>
            <i className="ti ti-lock"/>Actualizar contraseña
          </button>
        </div>
      </div>
    </div>
  );
}

        </div>

        {/* ── Lista de productos filtrada ── */}
        <div style={{border:'0.5px solid #e0deda',borderRadius:8,maxHeight:210,overflowY:'auto',marginBottom:12}}>
          {catFiltrada.length===0
            ?<div style={{textAlign:'center',padding:24,color:'#999',fontSize:13}}><i className="ti ti-search-off" style={{display:'block',fontSize:24,marginBottom:6}}/>Sin resultados</div>
            :catFiltrada.map(c=>{
              const vig=hp.find(p=>p.material===c.Nombre&&p.proveedor===c.Proveedor&&p.vigente);
              return(
                <div key={c.id} onClick={()=>selectItem(c)} style={{
                  display:'flex',alignItems:'center',justifyContent:'space-between',
                  padding:'9px 14px',cursor:'pointer',borderBottom:'0.5px solid #f0efe9',
                  background:selId===c.id?'#eff6ff':'transparent',
                  borderLeft:selId===c.id?'3px solid #2563eb':'3px solid transparent',transition:'all .1s'
                }}>
                  <div>
                    <span style={{fontWeight:selId===c.id?600:500,fontSize:13}}>{c.Nombre}</span>
                    <span style={{fontSize:11,color:'#999',marginLeft:8}}>{c.CC}</span>
                    <div style={{fontSize:11,color:'#5a5a5a',marginTop:2}}>
                      <span className="chip" style={{fontSize:10,marginRight:4}}>{c.Categoria}</span>
                      {c.Proveedor} · {c.Unidad}
                    </div>
                  </div>
                  <div style={{textAlign:'right',flexShrink:0,marginLeft:12}}>
                    {vig
                      ?<span className="badge badge-green" style={{fontSize:11}}><i className="ti ti-check"/>{fmt(+vig.precio)}</span>
                      :<span style={{fontWeight:600,color:'#16a34a',fontSize:13}}>{fmt(+c.Precio||0)}</span>
                    }
                  </div>
                </div>
              );
            })
          }
        </div>

        {/* ── Detalle seleccionado ── */}
        {item&&(
          <div style={{background:'#f8f7f4',borderRadius:8,padding:'10px 14px',marginBottom:14,fontSize:12,display:'flex',gap:16,flexWrap:'wrap',alignItems:'center',border:'0.5px solid #e0deda'}}>
            <span><span style={{color:'#999'}}>Proveedor:</span> <strong>{item.Proveedor}</strong></span>
            <span><span style={{color:'#999'}}>Unidad:</span> {item.Unidad}</span>
            <span><span style={{color:'#999'}}>C.C:</span> {item.CC}</span>
            <span><span style={{color:'#999'}}>Precio base:</span> <strong style={{color:'#16a34a'}}>{fmt(+item.Precio||0)}</strong></span>
            {vigente&&<span className="badge badge-green"><i className="ti ti-check"/>Vigente: {fmt(+vigente.precio)}</span>}
          </div>
        )}

        {/* ── Cantidad y precio ── */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div className="form-group">
            <label>Cantidad *</label>
            <input type="number" min="0" step="any" value={cant} onChange={e=>setCant(e.target.value)} placeholder="0" disabled={!item}/>
          </div>
          <div className="form-group">
            <label>Precio unitario {vigente?'(vigente aplicado)':item?'(catálogo)':''}</label>
            <input type="number" step="any" value={precioOv} onChange={e=>setPrecioOv(e.target.value)} placeholder={precioBase||'0.00'} disabled={!item}/>
          </div>
        </div>

        {item&&cant&&(
          <div style={{background:'#f0fdf4',borderRadius:8,padding:'10px 14px',border:'0.5px solid #86efac'}}>
            <strong style={{color:'#16a34a'}}>
              Subtotal: {new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2,maximumFractionDigits:2}).format((+precioBase||0)*(+cant||0))}
            </strong>
            <span style={{fontSize:12,color:'#16a34a',marginLeft:8}}>({cant} {item.Unidad} × {fmt(+precioBase||0)})</span>
          </div>
        )}
      </div>
      <div className="modal-footer">
        <span style={{fontSize:12,color:'#999',marginRight:'auto'}}>{catFiltrada.length} productos encontrados</span>
        <button className="btn" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!item||!cant}
          onClick={()=>onSave(estId,{material:item.Nombre,proveedor:item.Proveedor,unidad:item.Unidad,precio:precioBase,cantidad:cant,categoria:item.Categoria,cc:item.CC})}>
          <i className="ti ti-plus"/>Agregar ítem
        </button>
      </div>
    </div>
  );
}

function ModalNuevoPrecio({cat,onSave,onClose}){
  const [f,setF]=useState({material:'',proveedor:'',precio:'',notas:'',vigente:true});
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  const mats=[...new Set(cat.map(c=>c.Nombre).filter(Boolean))];
  const provs=[...new Set(cat.map(c=>c.Proveedor).filter(Boolean))];
  return(
    <div className="modal">
      <div className="modal-header"><h3>Registrar precio</h3><button className="btn btn-sm" onClick={onClose}><i className="ti ti-x"/></button></div>
      <div className="modal-body">
        <div className="form-group"><label>Material *</label><select value={f.material} onChange={e=>s('material',e.target.value)}><option value="">— Selecciona —</option>{mats.map((m,i)=><option key={i} value={m}>{m}</option>)}</select></div>
        <div className="form-group"><label>Proveedor *</label><select value={f.proveedor} onChange={e=>s('proveedor',e.target.value)}><option value="">— Selecciona —</option>{provs.map((p,i)=><option key={i} value={p}>{p}</option>)}</select></div>
        <div className="form-group"><label>Precio unitario *</label><input type="number" step="any" value={f.precio} onChange={e=>s('precio',e.target.value)} placeholder="0.00"/></div>
        <div className="form-group"><label>Notas</label><input value={f.notas} onChange={e=>s('notas',e.target.value)} placeholder="Ej: Cotización válida 30 días"/></div>
        <div style={{display:'flex',alignItems:'center',gap:10,marginTop:4,cursor:'pointer'}} onClick={()=>s('vigente',!f.vigente)}>
          <div style={{width:18,height:18,borderRadius:4,border:`2px solid ${f.vigente?'#16a34a':'#ccc'}`,background:f.vigente?'#16a34a':'transparent',display:'flex',alignItems:'center',justifyContent:'center'}}>
            {f.vigente&&<i className="ti ti-check" style={{color:'#fff',fontSize:11}}/>}
          </div>
          <span style={{fontSize:13}}>Marcar como precio vigente</span>
        </div>
      </div>
      <div className="modal-footer">
        <button className="btn" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!f.material||!f.proveedor||!f.precio} onClick={()=>onSave(f)}>Guardar</button>
      </div>
    </div>
  );
}

function ModalConcepto({item,onSave,onClose,sheetOk=false}){
  const isEdit=!!item;
  const CATS_BASE=['Materiales','Acero','Mampostería','Pétreos','Instalaciones','Eléctrico','Mano de Obra','Herramienta','Otro'];
  const initCat=isEdit?(item.Categoria||''):'';
  // Normalizar: buscar en la lista ignorando mayúsculas
  const matchedCat=CATS_BASE.find(c=>c.toLowerCase()===initCat.toLowerCase())||initCat;
  // Si la categoría existente no está en la lista base, la agregamos para que el select funcione
  const cats=CATS_BASE.find(c=>c.toLowerCase()===initCat.toLowerCase())||!initCat?CATS_BASE:[...CATS_BASE,initCat];
  const [f,setF]=useState(isEdit
    ?{Nombre:item.Nombre||'',Categoria:matchedCat,Unidad:item.Unidad||'',Precio:item.Precio||'',Proveedor:item.Proveedor||'',CC:item.CC||''}
    :{Nombre:'',Categoria:'',Unidad:'',Precio:'',Proveedor:'',CC:''}
  );
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  return(
    <div className="modal">
      <div className="modal-header">
        <h3>{isEdit?'Editar concepto':'Nuevo concepto'}</h3>
        <button className="btn btn-sm" onClick={onClose}><i className="ti ti-x"/></button>
      </div>
      <div className="modal-body">
        <div className="form-group"><label>Nombre *</label><input placeholder="Ej: Concreto premezclado f'c=250" value={f.Nombre} onChange={e=>s('Nombre',e.target.value)}/></div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div className="form-group">
            <label>Categoría *</label>
            <select value={CATS_BASE.includes(f.Categoria)?f.Categoria:'__custom__'} onChange={e=>{if(e.target.value!=='__custom__')s('Categoria',e.target.value);else s('Categoria','');}}>
              <option value="">— Selecciona —</option>
              {cats.map(c=><option key={c} value={c}>{c}</option>)}
              <option value="__custom__">✏️ Otra (escribe abajo)</option>
            </select>
            {!CATS_BASE.includes(f.Categoria)&&<input style={{marginTop:6}} placeholder="Escribe la categoría" value={f.Categoria} onChange={e=>s('Categoria',e.target.value)}/>}
          </div>
          <div className="form-group"><label>Unidad *</label><input placeholder="M3, Pieza, Metro..." value={f.Unidad} onChange={e=>s('Unidad',e.target.value)}/></div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div className="form-group"><label>Precio unitario *</label><input type="number" step="any" placeholder="0.00" value={f.Precio} onChange={e=>s('Precio',e.target.value)}/></div>
          <div className="form-group"><label>Proveedor</label><input placeholder="Proveedor" value={f.Proveedor} onChange={e=>s('Proveedor',e.target.value)}/></div>
        </div>
        <div className="form-group"><label>Clave / C.C</label><input placeholder="MAT-099" value={f.CC} onChange={e=>s('CC',e.target.value)}/></div>
        {isEdit&&<div style={{background:'#eff6ff',borderRadius:8,padding:'8px 12px',fontSize:12,color:'#2563eb'}}>
          <i className="ti ti-info-circle" style={{marginRight:6}}/>
          {sheetOk?'Los cambios se sincronizarán en Google Sheets al guardar.':'Los cambios se guardarán localmente.'}
        </div>}
      </div>
      <div className="modal-footer">
        <button className="btn" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!f.Nombre||!f.Categoria||!f.Unidad||!f.Precio} onClick={()=>onSave(f)}>
          {isEdit?<><i className="ti ti-check"/>Guardar cambios</>:<><i className="ti ti-plus"/>Agregar al catálogo</>}
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
