<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo MexicoConstructora25</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">
    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-900">Catálogo MexicoConstructora25</h1>
        
        <!-- Formulario -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8 bg-gray-50 p-6 rounded-lg border border-gray-200">
            <input type="text" id="id" placeholder="ID" class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="text" id="nombre" placeholder="Nombre" class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="text" id="categoria" placeholder="Categoría" class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="text" id="unidad" placeholder="Unidad" class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="number" id="precio" placeholder="Precio" class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="text" id="proveedor" placeholder="Proveedor" class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="text" id="cc" placeholder="C.C" class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
            <button id="btnGuardar" class="bg-blue-600 text-white font-bold rounded hover:bg-blue-700 transition shadow-md">Guardar Producto</button>
        </div>

        <!-- Tabla -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse bg-white shadow-sm rounded-lg overflow-hidden">
                <thead>
                    <tr class="bg-blue-800 text-white uppercase text-sm">
                        <th class="p-3 border-b">ID</th>
                        <th class="p-3 border-b">Nombre</th>
                        <th class="p-3 border-b">Categoría</th>
                        <th class="p-3 border-b">Precio</th>
                    </tr>
                </thead>
                <tbody id="listaCatalogo" class="text-gray-700">
                    <tr><td colspan="4" class="p-4 text-center italic">Cargando datos de la nube...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // URL de tu API en Google Apps Script
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbypyD9RQmscNxYZAQ7WDMKx0mhQ4wMU-HfTOT5vy4vLlIKW3Ky1xr9hrP8KzDdvtUce/exec";

        async function cargarDatos() {
            const tbody = document.getElementById('listaCatalogo');
            try {
                const response = await fetch(WEB_APP_URL);
                const datos = await response.json();
                
                tbody.innerHTML = '';
                if(datos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center">No hay productos registrados.</td></tr>';
                    return;
                }

                datos.forEach(d => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50 border-b">
                            <td class="p-3 border-r">${d.id || '-'}</td>
                            <td class="p-3 border-r">${d.nombre || '-'}</td>
                            <td class="p-3 border-r">${d.categoria || '-'}</td>
                            <td class="p-3">$${parseFloat(d.precio || 0).toLocaleString()}</td>
                        </tr>`;
                });
            } catch (e) {
                console.error("Error:", e);
                tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-red-500 text-center">Error al conectar con la base de datos.</td></tr>';
            }
        }

        document.getElementById('btnGuardar').addEventListener('click', async () => {
            const data = {
                id: document.getElementById('id').value,
                nombre: document.getElementById('nombre').value,
                categoria: document.getElementById('categoria').value,
                unidad: document.getElementById('unidad').value,
                precio: document.getElementById('precio').value,
                proveedor: document.getElementById('proveedor').value,
                cc: document.getElementById('cc').value
            };
            
            // Validación básica
            if(!data.nombre || !data.id) {
                alert("Por favor, llena al menos ID y Nombre");
                return;
            }

            const btn = document.getElementById('btnGuardar');
            btn.innerText = "Guardando...";
            btn.disabled = true;

            try {
                await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    body: JSON.stringify(data) 
                });
                
                alert("Guardado correctamente");
                
                // Limpiar campos
                document.querySelectorAll('input').forEach(i => i.value = '');
                
                cargarDatos();
            } catch (e) {
                alert("Error al guardar en el servidor: " + e.message);
            } finally {
                btn.innerText = "Guardar Producto";
                btn.disabled = false;
            }
        });

        // Carga inicial
        cargarDatos();
    </script>
</body>
</html>
