<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo MexicoConstructora25</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-800">Catálogo MexicoConstructora25</h1>
        
        <!-- Formulario -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8 bg-gray-50 p-4 rounded border">
            <input type="text" id="id" placeholder="ID" class="border p-2 rounded">
            <input type="text" id="nombre" placeholder="Nombre" class="border p-2 rounded">
            <input type="text" id="categoria" placeholder="Categoría" class="border p-2 rounded">
            <input type="text" id="unidad" placeholder="Unidad" class="border p-2 rounded">
            <input type="number" id="precio" placeholder="Precio" class="border p-2 rounded">
            <input type="text" id="proveedor" placeholder="Proveedor" class="border p-2 rounded">
            <input type="text" id="cc" placeholder="C.C" class="border p-2 rounded">
            <button id="btnGuardar" class="bg-blue-600 text-white rounded hover:bg-blue-700 transition">Guardar Producto</button>
        </div>

        <!-- Tabla -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse bg-white shadow-sm">
                <thead>
                    <tr class="bg-blue-800 text-white">
                        <th class="p-2 border">ID</th>
                        <th class="p-2 border">Nombre</th>
                        <th class="p-2 border">Categoría</th>
                        <th class="p-2 border">Precio</th>
                    </tr>
                </thead>
                <tbody id="listaCatalogo">
                    <tr><td colspan="4" class="p-4 text-center">Cargando datos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Asegúrate de que esta URL sea la que obtuviste al implementar tu Google Apps Script
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbypyD9RQmscNxYZAQ7WDMKx0mhQ4wMU-HfTOT5vy4vLlIKW3Ky1xr9hrP8KzDdvtUce/exec";

        // Función para cargar datos desde Google Sheets
        async function cargarDatos() {
            try {
                const response = await fetch(WEB_APP_URL);
                const datos = await response.json();
                const tbody = document.getElementById('listaCatalogo');
                tbody.innerHTML = '';
                datos.forEach(d => {
                    tbody.innerHTML += `<tr>
                        <td class="p-2 border">${d.id || ''}</td>
                        <td class="p-2 border">${d.nombre || ''}</td>
                        <td class="p-2 border">${d.categoria || ''}</td>
                        <td class="p-2 border">$${d.precio || 0}</td>
                    </tr>`;
                });
            } catch (e) {
                document.getElementById('listaCatalogo').innerHTML = '<tr><td colspan="4" class="p-4 text-red-500 text-center">Error al conectar con la hoja de cálculo.</td></tr>';
            }
        }

        // Función para guardar datos en Google Sheets
        document.getElementById('btnGuardar').addEventListener('click', async () => {
            const data = {
                id: document.getElementById('id').value,
                nombre: document.getElementById('nombre').value,
                categoria: document.getElementById('categoria').value,
                unidad: document.getElementById('unidad').value,
                precio: document.getElementById('precio').value,
                proveedor: document.getElementById('proveedor').value,
                cc: document.getElementById('cc').value
            };
            
            try {
                const btn = document.getElementById('btnGuardar');
                btn.innerText = "Guardando...";
                btn.disabled = true;

                await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify(data) 
                });
                
                alert("Guardado correctamente en la hoja de cálculo");
                btn.innerText = "Guardar";
                btn.disabled = false;
                cargarDatos(); // Recargar la tabla
            } catch (e) {
                alert("Error al guardar: " + e.message);
                btn.innerText = "Guardar";
                btn.disabled = false;
            }
        });

        // Cargar datos iniciales
        cargarDatos();
    </script>
</body>
</html>
